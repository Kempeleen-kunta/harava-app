<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARAVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #20242A;
    --muted: #5B6169;
    --line: #DDDAD2;
    --accent: #2B5D6B;
    --accent-ink: #FFFFFF;
    --mandatory: #A6631D;
    --mandatory-bg: #F3E6D5;
    --optional: #5B6169;
    --optional-bg: #EBEAE5;
    --scored: #1B5FA6;
    --scored-bg: #DCEAF7;
    --danger: #A23B3B;
    --danger-bg: #F3E1DF;
    --danger-ink: #FFFFFF;
    --success: #2F7D4F;
    --success-ink: #FFFFFF;
    --target: #7D3F6B;
    --target-ink: #FFFFFF;
    --focus: #2B5D6B;
    --subcat-heading: #1B3A6B;
    --selection-bg: #F0F9F2;
    --hue-0: #A23B3B;
    --hue-1: #2A5D8F;
    --hue-2: #2F7D4F;
    --hue-3: #6B4FA0;
    --hue-4: #1B8A8A;
    --hue-5: #A33B7A;
    --hue-6: #4B4FA0;
    --hue-7: #7A6A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181B;
      --surface: #1B2024;
      --ink: #E7E5DE;
      --muted: #9AA0A6;
      --line: #33393E;
      --accent: #74AABB;
      --accent-ink: #0F1315;
      --mandatory: #D08A3E;
      --mandatory-bg: #3A2E1C;
      --optional: #9AA0A6;
      --optional-bg: #262B2F;
      --scored: #6FA8DC;
      --scored-bg: #1C2E3A;
      --danger: #D9756E;
      --danger-bg: #3A2323;
      --danger-ink: #0F1315;
      --success: #6FC08A;
      --success-ink: #0F1315;
      --target: #D896C4;
      --target-ink: #241220;
      --focus: #74AABB;
      --subcat-heading: #8FB8E8;
      --selection-bg: #223A2F;
      --hue-0: #D9756E;
      --hue-1: #6FA0D0;
      --hue-2: #6FC08A;
      --hue-3: #B49BE0;
      --hue-4: #5FC4C4;
      --hue-5: #D97AB8;
      --hue-6: #9B9EE0;
      --hue-7: #C0AD6A;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181B;
    --surface: #1B2024;
    --ink: #E7E5DE;
    --muted: #9AA0A6;
    --line: #33393E;
    --accent: #74AABB;
    --accent-ink: #0F1315;
    --mandatory: #D08A3E;
    --mandatory-bg: #3A2E1C;
    --optional: #9AA0A6;
    --optional-bg: #262B2F;
    --scored: #6FA8DC;
    --scored-bg: #1C2E3A;
    --danger: #D9756E;
    --danger-bg: #3A2323;
    --danger-ink: #0F1315;
    --success: #6FC08A;
    --success-ink: #0F1315;
    --target: #D896C4;
    --target-ink: #241220;
    --focus: #74AABB;
    --subcat-heading: #8FB8E8;
    --selection-bg: #223A2F;
    --hue-0: #D9756E;
    --hue-1: #6FA0D0;
    --hue-2: #6FC08A;
    --hue-3: #B49BE0;
    --hue-4: #5FC4C4;
    --hue-5: #D97AB8;
    --hue-6: #9B9EE0;
    --hue-7: #C0AD6A;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; margin: 0; }
  a { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: var(--ink); }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .app { max-width: 1100px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 24px 16px; gap: 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { height: 40px; width: auto; display: block; }
  .brand-text strong { font-family: "Source Serif 4", serif; font-size: 19px; font-weight: 600; }
  .brand-text span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }

  .tabs { display: flex; gap: 4px; }
  .tab {
    background: none; border: none; padding: 9px 4px; margin-right: 20px;
    color: var(--muted); font-size: 14.5px; font-weight: 500;
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  /* Hallinta-näkymän alavälilehdet: yläpalkin .tabs/.tab + alaviiva ja rivitys. */
  .admin-tabs { flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 20px; }

  #banner { padding: 0 24px; }
  .banner {
    background: var(--mandatory-bg); color: var(--mandatory);
    border-radius: 6px; padding: 10px 14px; font-size: 13.5px; margin: 16px 0 0;
  }

  main { flex: 1; padding: 28px 24px 60px; }

  /* Näkymän otsikko ja ingressi käyttävät koko sisältöleveyttä. */
  .view-header { margin-bottom: 24px; }
  .view-header h1 { font-size: 26px; }
  .view-header .lede { color: var(--muted); margin: 8px 0 0; font-size: 14.5px; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 9px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { opacity: .92; }
  .btn.danger { color: var(--danger); border-color: var(--danger-bg); }
  .btn.danger:hover { border-color: var(--danger); }
  .btn.small { padding: 5px 10px; font-size: 12.5px; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover { border-color: var(--line); }
  /* Ääriviivallinen ensisijainen painike, esim. "Vastaanota tietoja"
     täytetyn "Jaa valitut" -painikkeen rinnalla. */
  .btn.ghost-primary { background: var(--surface); color: var(--accent); border-color: var(--accent); }
  .btn.ghost-primary:hover { background: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  /* Tiedostonvalinta: natiivi input piilotetaan visuaalisesti
     (.visually-hidden) ja sen <label> tyylitellään .btn-painikkeeksi.
     inline-block tarvitaan, jotta .btn:n padding toimii labelissa. */
  .file-btn-label { display: inline-block; }
  .file-btn-label.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

  /* --- Lomake: uuden vaatimuksen lisäys --- */
  .add-form {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 20px; margin-bottom: 28px; max-width: 640px;
  }
  /* Hallinta-näkymän lomakkeet ja listat täysleveinä. */
  #adminTabContent .add-form { max-width: none; }
  #adminTabContent .lists-register { max-width: none; }
  /* Dokumentit-näkymän listaus täysleveänä. */
  #listsRegister { max-width: none; }
  /* #addForm on vaiheittaisen lomakkeen sisällä, jonka kehyksen
     .add-wizard-shell piirtää. */
  #addForm.add-form { max-width: none; background: none; border: none; padding: 0; margin-bottom: 28px; }
  .field-row { margin-bottom: 14px; }
  .field-row label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .field-row textarea, .field-row input[type="text"], .field-row input[type="email"], .field-row input:not([type]) {
    width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--paper);
    padding: 9px 10px; color: var(--ink); resize: vertical;
  }
  .field-row textarea { min-height: 64px; }
  .field-row select {
    width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    padding: 7px 9px; color: var(--muted); font-size: 13px;
  }
  .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .radio-group { display: flex; gap: 16px; padding-top: 6px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 14px; margin: 0; }
  .radio-group input { margin: 0; }

  .add-form-col-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    font-weight: 600; margin-bottom: 12px;
  }
  .add-form-preview-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    font-weight: 600; margin-bottom: 10px;
  }

  /* Osallistu: nelivaiheinen lomake. Ylimpänä vaakasuora askelrivi,
     sen alla aktiivisen vaiheen kentät. */
  .add-wizard-shell { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .add-wizard-rail-h {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding: 18px 20px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .add-wizard-rail-h .rail-connector { flex: 1; height: 2px; background: var(--line); margin: 0 8px; min-width: 16px; }
  .add-wizard-rail-h .rail-connector.done { background: var(--success); }
  .add-wizard-rail-step {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; flex: none;
  }
  .add-wizard-rail-step.done, .add-wizard-rail-step.active { cursor: pointer; }
  .add-wizard-rail-step.active { background: var(--surface); border: 1px solid var(--line); }
  .add-wizard-rail-step .circle {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; flex: none;
    border: 2px solid var(--line); color: var(--muted); background: var(--surface);
  }
  .add-wizard-rail-step.done .circle { border-color: var(--success); background: var(--success); color: var(--success-ink); }
  .add-wizard-rail-step.active .circle { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .add-wizard-rail-step .rail-step-text { display: flex; flex-direction: column; min-width: 0; }
  .add-wizard-rail-step .label { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .add-wizard-rail-step.active .label, .add-wizard-rail-step.done .label { color: var(--ink); font-weight: 500; }
  .add-wizard-rail-step .step-summary {
    font-size: 11px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 140px;
  }
  @media (max-width: 700px) {
    .add-wizard-rail-h .rail-connector { display: none; }
    .add-wizard-rail-step .step-summary { max-width: 90px; }
  }
  /* Vaiheen 4 esikatselu. */
  .add-wizard-preview-bar { margin-bottom: 4px; }
  .add-wizard-preview-bar .req-card { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .add-wizard-preview-bar .req-card-top { margin-bottom: 0; flex: none; }
  .add-wizard-preview-bar .req-card-text { margin: 0; flex: 1 1 260px; }
  .add-wizard-preview-bar .req-card-chips { margin-bottom: 0; flex: none; }
  .add-wizard-preview-bar .target-pill-row { margin: 0; flex: none; }
  .add-wizard-preview-bar .req-card-note { flex-basis: 100%; margin: 4px 0 0; }
  .add-wizard-form-col { padding: 22px; background: var(--surface); }
  .add-wizard-form-col .field-row { max-width: 480px; }
  .add-wizard-form-col .wizard-choice-cards, .add-wizard-form-col .wizard-nav { max-width: 640px; }
  /* Kaksipalstainen asettelu vaiheille 2 ja 3. Kenttien leveys tulee
     grid-sarakkeesta. */
  .wizard-two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; margin-bottom: 4px; }
  .wizard-two-col .field-row { max-width: none; }
  @media (max-width: 700px) { .wizard-two-col { grid-template-columns: 1fr; } }
  .wizard-nav { display: flex; justify-content: space-between; margin-top: 18px; }
  .wizard-choice-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 560px) { .wizard-choice-cards { grid-template-columns: 1fr; } }
  .wizard-choice-card {
    border: 2px solid var(--line); border-radius: 8px; padding: 16px; background: var(--paper);
    cursor: pointer; text-align: left; font-family: inherit; display: flex; flex-direction: column; gap: 4px;
  }
  .wizard-choice-card .icon { font-size: 20px; }
  .wizard-choice-card .title { font-family: "Source Serif 4", serif; font-weight: 600; font-size: 15px; color: var(--ink); }
  .wizard-choice-card .desc { font-size: 12px; color: var(--muted); }
  .wizard-choice-card.active { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 1px var(--accent); }
  .wizard-choice-card.active .title { color: var(--accent); }
  /* Vaiheen 1 hakutulosten toiminnot: "Muokkaa tätä" + poisto-ikoni. */
  .req-card-pick-actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .req-card-pick-actions .delete-existing-btn {
    width: 26px; height: 26px; border-radius: 5px; border: 1px solid transparent; background: none;
    color: var(--muted); cursor: pointer; font-size: 13px; display: flex; align-items: center;
    justify-content: center; font-family: inherit; flex: none;
  }
  .req-card-pick-actions .delete-existing-btn:hover { border-color: var(--line); color: var(--danger); }

  /* --- Työkalurivi (haku/suodatus) --- */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="search"], .toolbar select {
    border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    padding: 8px 10px; color: var(--ink);
  }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; }

  /* Avattavat/suljettavat kortit (.cat-card/.cat-head/.cat-body) */
  .cat-card { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: var(--surface); }
  .cat-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: var(--ink);
  }
  .cat-head::before { content: "▸ "; color: var(--muted); flex: none; }
  .cat-card.open .cat-head::before { content: "▾ "; }
  .cat-head .cat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-head .count {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); font-weight: 400;
    background: var(--optional-bg); border-radius: 20px; padding: 2px 9px; flex: none;
  }
  /* Suodatinkortin otsikkorivin säätimet: badge ja järjestysvalikko,
     käytettävissä myös kortin ollessa kiinni. */
  .cat-head-controls { display: flex; align-items: center; gap: 10px; flex: none; }
  .header-sort-select {
    border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink);
    font-size: 12.5px; padding: 4px 10px; font-family: inherit; cursor: pointer; max-width: 160px;
  }
  .cat-card .cat-body { padding: 2px 14px 4px; border-top: 1px solid var(--line); }

  .row-actions { flex: none; display: flex; gap: 6px; }
  .row-actions button { background: none; border: none; color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
  .row-actions button:hover { color: var(--accent); }
  .row-actions button.delete:hover { color: var(--danger); }

  /* Vaatimuskortit: Kirjasto, Osallistun esikatselu ja haku, editorin
     Valittavat/Valitut sekä Tee yhteistyötä. */
  .req-cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .req-card {
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--optional);
    border-radius: 6px; padding: 14px 16px 14px 14px;
  }
  .req-card.mandatory { border-left-color: var(--mandatory); }
  .req-card.optional { border-left-color: var(--optional); }
  .req-card.scored { border-left-color: var(--scored); }
  .req-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .req-type-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .req-type-label.mandatory { color: var(--mandatory); }
  .req-type-label.optional { color: var(--optional); }
  .req-type-label.scored { color: var(--scored); }
  .req-card-text { margin: 0 0 10px; font-size: 14.5px; line-height: 1.55; }
  .req-card-note {
    margin: -4px 0 10px; font-size: 13px; line-height: 1.5; color: var(--muted); font-style: italic;
  }
  .req-card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .req-chip {
    font-size: 11.5px; color: var(--chip-color, var(--accent)); border: 1px solid var(--chip-color, var(--accent));
    border-radius: 5px; padding: 2px 7px; font-weight: 500;
  }
  .req-chip-owner { --chip-color: var(--accent); }
  .req-card-attribution { display: block; font-size: 11px; color: var(--muted); }

  /* Hankinnan kohteet vaatimuskortilla: täytetty pillirivi. */
  .target-pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .target-pill {
    background: var(--target); color: var(--target-ink); font-weight: 600; font-size: 12.5px;
    padding: 4px 11px; border-radius: 20px;
  }

  .empty-state {
    border: 1px dashed var(--line); border-radius: 8px; padding: 28px 20px;
    text-align: center; color: var(--muted); font-size: 14px; max-width: 640px;
  }

  /* --- Listat --- */
  .lists-register { display: flex; flex-direction: column; gap: 10px; max-width: 720px; }
  .list-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px; justify-content: space-between;
  }
  .list-card .list-card-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .list-card .meta h3 { font-size: 15.5px; margin-bottom: 3px; }
  .list-card .meta p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .list-card .meta p + p { margin-top: 2px; }
  .list-card .actions { display: flex; gap: 8px; flex: none; }

  /* Hankinnan kohteet -hallinta: oma laatikko ja lisäysrivi kullekin
     Omistajalle. */
  .owner-target-group {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .owner-target-head {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .owner-target-head h3 { font-size: 15px; }
  .owner-target-head .count { font-size: 12px; color: var(--muted); }
  .owner-target-add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* "Hankinnan kohde" -suodatinpaneelin Omistaja-ryhmät
     (procurementTargetFilterPanelHtml()). */
  .owner-subgroup { margin-bottom: 12px; }
  .owner-subgroup:last-of-type { margin-bottom: 0; }
  .owner-subgroup h4 {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; margin-bottom: 6px;
  }

  /* Dokumentin Hankinnan kohde -hakukombo: valittujen kippirivi +
     tekstihaku, jonka alle avautuva pudotusvalikko näyttää osumat. */
  .selected-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .selected-row .empty-hint { font-size: 12.5px; color: var(--muted); font-style: italic; }
  .sel-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--target); color: var(--target-ink);
    font-size: 12.5px; font-weight: 600; padding: 4px 6px 4px 11px; border-radius: 20px;
  }
  .sel-chip button {
    background: rgba(255,255,255,.25); border: none; color: inherit; width: 17px; height: 17px; border-radius: 50%;
    font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    font-family: inherit;
  }
  .combo-wrap { position: relative; }
  .combo-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.15);
    max-height: 260px; overflow-y: auto; z-index: 5;
  }
  .combo-option {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px;
    cursor: pointer; font-size: 13.5px; border-bottom: 1px solid var(--line);
  }
  .combo-option:last-child { border-bottom: none; }
  .combo-option:hover { background: var(--paper); }
  .combo-option .owner-hint { font-size: 11.5px; color: var(--muted); font-family: "IBM Plex Mono", monospace; flex: none; }

  /* Osallistu-lomakkeen fraasin hakuvalitsin: hakukenttä ja tuloslista. */
  .phrase-picker { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
  .phrase-picker-filters { padding: 10px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .phrase-picker-list { max-height: 280px; overflow-y: auto; }
  .phrase-picker-item { padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--line); }
  .phrase-picker-item:last-child { border-bottom: none; }
  .phrase-picker-item:hover { background: var(--paper); }
  .phrase-picker-item .cat-hint { display: block; font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", monospace; margin-top: 2px; }
  .phrase-picker-empty { padding: 12px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* Tuloslistan otsikko, esim. "Haun tulokset (N)". */
  .stage-title { font-size: 17px; margin: 0 0 4px; }
  /* --- Etusivu --- */
  .home-hero { margin-bottom: 22px; }
  .home-hero h1 { margin: 0 0 6px; }
  .home-hero .lede { color: var(--muted); margin: 0; }
  .home-main-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 24px;
  }
  /* Suljettava tulosraportti (seed-alustus ja yhteistyö-tuonti). */
  .result-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 20px;
  }
  .result-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .result-card-title { font-weight: 600; font-size: 14px; }
  .result-card-line { margin: 0 0 6px; font-size: 13.5px; color: var(--ink); }
  .result-card-line:last-child { margin-bottom: 0; }
  /* Tee yhteistyötä -näkymän "Toiminnot"-rivi suodatinkortin ja
     tuloslistan välissä. */
  .collab-actions-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .collab-actions-label { font-size: 13.5px; font-weight: 500; color: var(--muted); }
  .collab-actions-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .collab-import-preview {
    margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  }
  .collab-import-preview ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  .collab-import-actions { display: flex; gap: 8px; margin-top: 12px; }
  .collab-import-error { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .collab-share-toggle {
    border: none; border-radius: 6px; padding: 6px 14px; font-size: 12.5px; font-weight: 600;
    background: var(--danger); color: var(--danger-ink); white-space: nowrap; transition: background .15s;
  }
  .collab-share-toggle.sharing { background: var(--success); color: var(--success-ink); }
  .home-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    margin-bottom: 26px;
  }
  @media (max-width: 800px) { .home-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .home-grid { grid-template-columns: 1fr; } }
  .home-card {
    display: block; text-align: left; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 16px;
    cursor: pointer; font: inherit; color: inherit;
  }
  .home-card:hover { border-color: var(--accent); }
  .home-card-num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--paper);
    border: 1px solid var(--line); color: var(--muted); font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
  }
  .home-card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .home-card-lede { color: var(--muted); font-size: 13px; margin: 0; }
  .home-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    border-top: 1px solid var(--line); padding-top: 18px; margin-bottom: 26px;
  }
  @media (max-width: 520px) { .home-stats { grid-template-columns: 1fr; } }
  .home-stat { text-align: center; }
  .home-stat .n {
    font-family: "IBM Plex Mono", monospace; font-size: 26px; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .home-stat .label { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .home-cats { max-width: 640px; }
  .home-cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .home-cat-name { width: 140px; flex-shrink: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .home-cat-bar-track { flex: 1; height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
  .home-cat-bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .home-cat-count { width: 32px; flex-shrink: 0; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .home-cat-row-rest .home-cat-name, .home-cat-row-rest .home-cat-count { color: var(--muted); }
  /* --- Editori --- */
  .editor-toolbar { margin-bottom: 14px; }
  .editor-head {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 20px; margin-bottom: 22px;
  }
  .editor-head #listName {
    font-family: "Source Serif 4", serif; font-size: 17px; font-weight: 600;
  }
  .editor-head .field-row textarea { min-height: 40px; }
  .editor-head .field-row select {
    width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    padding: 9px 10px; color: var(--ink); font-size: 14px; font-family: inherit;
  }
  .editor-head .contact-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .editor-head .contact-row .field-row { flex: 1; min-width: 160px; }
  .editor-head-actions {
    display: flex; gap: 10px; margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .editor-head-actions .btn { flex: 1; text-align: center; }

  .pick-checkbox { margin-top: 3px; flex: none; width: 16px; height: 16px; accent-color: var(--accent); }

  /* Isompi .cat-card-osio "Hakuehdot ja suodattimet" -korteille. */
  .section-card { margin-bottom: 16px; }
  .section-card .cat-head { font-size: 15px; padding: 12px 16px; }
  .section-card .cat-body { padding: 6px 16px 16px; }
  .filter-search-input {
    width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    padding: 8px 10px; color: var(--ink);
  }

  /* "Hakuehdot ja suodattimet" -korttien välilehdet. */
  .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .filter-tab {
    border: none; background: none; padding: 7px 4px; margin-right: 16px;
    color: var(--muted); font-size: 13px; font-weight: 500;
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  .filter-tab:hover { color: var(--ink); }
  .filter-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .filter-tab .count { color: var(--muted); font-weight: 400; }
  /* Suodattimen arvot on/off-painikkeina. */
  .filter-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-toggle-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .filter-toggle-btn:hover { border-color: var(--accent); }
  .filter-toggle-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* "Ajan mukaan" -välilehti (timeFilterPanelHtml()): pikavalinnat ja
     avattavat vuosi-/kuukausi-/aikaväliryhmät. */
  .time-quick-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .time-quick-chip {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px;
    padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .time-quick-chip:hover { border-color: var(--accent); }
  .time-disclosure-btn {
    display: block; border: none; background: none; color: var(--accent); font-size: 12.5px;
    font-weight: 500; cursor: pointer; padding: 4px 0; font-family: inherit;
  }
  .time-advanced-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .time-group { margin-bottom: 14px; }
  .time-group:last-child { margin-bottom: 0; }
  .time-group h4 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    font-weight: 600; margin: 0 0 8px;
  }

  /* Editorin Valittavat/Valitut-välilehdet. */
  .editor-tabs { border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  /* Valittavat-kortin "+ Lisää dokumentille" -painike. */
  .add-to-list-btn {
    border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 20px;
    padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .add-to-list-btn:hover { background: var(--accent); color: var(--accent-ink); }

  /* Valitut-kortin yläriville järjestysnumero ja tyyppi yhtenä lohkona,
     jotta .req-card-top pysyy kahden lapsen space-between-rivinä. */
  .req-card-top-left { display: flex; align-items: center; gap: 8px; }
  .sel-num { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .sel-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .sel-actions button[data-action="move-up"], .sel-actions button[data-action="move-down"] {
    width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 12px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-family: inherit;
  }
  .sel-actions button[data-action="move-up"]:hover:not(:disabled),
  .sel-actions button[data-action="move-down"]:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .sel-actions button:disabled { opacity: .35; cursor: default; }
  .remove-from-list-btn {
    border: none; background: none; color: var(--danger); font-size: 12.5px; font-weight: 500; cursor: pointer;
    white-space: nowrap; font-family: inherit;
  }
  .remove-from-list-btn:hover { text-decoration: underline; }
  .sel-note-input {
    display: block; width: 100%; margin-top: 8px; padding: 6px 8px; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink);
    resize: vertical; min-height: 30px;
  }

  /* --- Tulostusnäkymä --- */
  .print-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .print-doc { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 48px 56px; max-width: 720px; margin: 0 auto; }
  .print-doc + .print-doc { margin-top: 32px; }
  /* Ohje-näkymän artikkeli täysleveänä (tulostettavat dokumentit pysyvät
     sivun levyisinä). */
  .print-doc-wide { max-width: none; margin: 0; }
  .print-head { margin-bottom: 32px; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
  .print-head h1 { font-size: 28px; margin-bottom: 6px; }
  .print-group { margin-bottom: 26px; }
  .print-group h2 { font-size: 16px; margin-bottom: 10px; }
  .print-group ol { list-style: none; margin: 0; padding: 0; }
  .print-group ol li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .print-group ol li:last-child { border-bottom: none; }
  .print-group ul li { margin-bottom: 4px; }
  /* Ohjeen numeroidut toimenpidelistat: ohittaa .print-group ol li
     -säännöt. */
  .print-group ol.help-steps { list-style: decimal; }
  .print-group ol.help-steps li {
    display: list-item; padding: 0; border-bottom: none; margin-bottom: 6px;
  }
  .print-group ol.help-steps li:last-child { margin-bottom: 0; }
  .print-group p { margin: 0; font-size: 14px; flex: 1; }

  /* Dokumentin tuloste (printDocHtml()): perustietolaatikko ja tyypin
     mukaan ryhmitellyt kolmilohkoiset vaatimuskortit. */
  .print-header-block { margin-bottom: 30px; }
  .print-header-block h1 { font-size: 26px; margin-bottom: 16px; }
  .print-info-box {
    border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px;
    display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; margin: 0;
  }
  .print-info-box dt { color: var(--muted); font-weight: 500; }
  .print-info-box dd { margin: 0; white-space: pre-wrap; }
  .print-target-pill {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: var(--target); color: var(--target-ink); margin: 0 4px 4px 0;
  }
  .print-type-section { margin-bottom: 28px; }
  .print-type-section:last-child { margin-bottom: 0; }
  .print-type-head {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; padding-bottom: 6px;
    border-bottom: 2px solid currentColor;
  }
  .print-type-head h2 { font-size: 17px; }
  .print-type-head .print-type-count { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 400; color: var(--muted); }
  .print-type-section.mandatory .print-type-head { color: var(--mandatory); }
  .print-type-section.scored .print-type-head { color: var(--scored); }
  .print-type-section.optional .print-type-head { color: var(--optional); }
  .print-cat-group { margin-bottom: 16px; }
  .print-cat-group:last-child { margin-bottom: 0; }
  .print-cat-group h3 { font-size: 13.5px; color: var(--ink); margin-bottom: 8px; }
  .print-card {
    border: 1px solid var(--line); border-left: 3px solid var(--optional); border-radius: 5px;
    margin-bottom: 8px; overflow: hidden;
  }
  .print-type-section.mandatory .print-card { border-left-color: var(--mandatory); }
  .print-type-section.scored .print-card { border-left-color: var(--scored); }
  .print-type-section.optional .print-card { border-left-color: var(--optional); }
  .print-card-block { padding: 10px 14px; }
  .print-card-block + .print-card-block { border-top: 1px solid var(--line); }
  .print-card-top { display: flex; gap: 10px; align-items: flex-start; }
  .print-card-top p { margin: 0; font-size: 14px; }
  .print-numbox {
    flex: none; width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center;
    justify-content: center; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700;
    color: var(--paper); margin-top: 1px;
  }
  .print-type-section.mandatory .print-numbox { background: var(--mandatory); }
  .print-type-section.scored .print-numbox { background: var(--scored); }
  .print-type-section.optional .print-numbox { background: var(--optional); }
  .print-subcat-tag {
    display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-bottom: 4px;
  }
  .print-card-notes { background: var(--paper); }
  .print-note { margin: 0; font-size: 12.5px; color: var(--muted); font-style: italic; }
  .print-note + .print-note { margin-top: 5px; }
  .print-card-targets { display: flex; flex-wrap: wrap; gap: 0; align-items: center; }
  .print-block-label {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .03em; text-transform: uppercase;
    color: var(--muted); margin-right: 6px;
  }
  .help-toc {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .help-toc-label { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
  #helpTocSelect {
    border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    padding: 7px 9px; color: var(--ink); font-size: 13px;
  }

  @media print {
    .no-print { display: none !important; }
    .topbar, #banner { display: none !important; }
    body { background: #fff; }
    .print-doc { border: none; padding: 0; max-width: none; }
    .print-doc + .print-doc { margin-top: 0; page-break-before: always; }
    main { padding: 0; }
  }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* --- Vahvistusikkuna --- */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(20, 24, 27, 0.45);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000;
  }
  .confirm-overlay[hidden] { display: none; }
  .confirm-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 22px; max-width: 360px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .confirm-box p { margin: 0 0 18px; font-size: 14.5px; color: var(--ink); }
  .confirm-box .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
  @media print { .confirm-overlay { display: none !important; } }
</style>

<body>
<div class="app">
  <header class="topbar no-print">
    <div class="brand">
      <img class="brand-mark" src="images/logo.png" alt="HARAVA">
      <div class="brand-text">
        <strong>HARAVA</strong>
        <span>Hankintojen rakenteelliset vaatimukset</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <nav class="tabs" id="tabs">
        <button class="tab" data-action="nav" data-view="home">Etusivu</button>
        <button class="tab" data-action="nav" data-view="help">Kouluttaudu</button>
        <button class="tab" data-action="nav" data-view="library">Tutustu</button>
        <button class="tab" data-action="nav" data-view="add">Osallistu</button>
        <button class="tab" data-action="nav" data-view="lists">Hyödynnä</button>
        <button class="tab" data-action="nav" data-view="collaborate">Tee yhteistyötä</button>
        <button class="tab" data-action="nav" data-view="categories">Mukauta</button>
      </nav>
      <button type="button" class="btn small primary" data-action="switch-api-key" id="switchApiKeyBtn" hidden title="Vaihda toiseen API-avaimeen">Vaihda avain</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="confirmOverlay" class="confirm-overlay no-print" hidden>
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button type="button" class="btn ghost" data-action="confirm-no">Peruuta</button>
      <button type="button" class="btn danger" data-action="confirm-yes">Poista</button>
    </div>
  </div>
</div>
<div id="alertOverlay" class="confirm-overlay no-print" hidden>
  <div class="confirm-box">
    <p id="alertMessage"></p>
    <div class="confirm-actions">
      <button type="button" class="btn primary" data-action="alert-ok">OK</button>
    </div>
  </div>
</div>
<div id="apiKeyOverlay" class="confirm-overlay no-print" hidden>
  <div class="confirm-box">
    <form id="apiKeyForm">
      <p style="margin:0 0 12px">Rajapinta vaatii API-avaimen jatkaakseen.</p>
      <input type="text" id="apiKeyInput" name="apiKey" placeholder="API-avain" autocomplete="off"
        style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin-bottom:10px;background:var(--surface);color:var(--ink)">
      <p id="apiKeyError" style="color:var(--danger);font-size:13px;margin:0 0 12px;min-height:16px"></p>
      <div class="confirm-actions">
        <button type="submit" class="btn primary">Tallenna</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Tila ----------
  var state = {
    view: "home",
    requirements: [],
    lists: [],
    categories: [],
    subcategories: [],
    industries: [],
    companies: [],
    phrases: [],
    procurementTargets: [],
    reqsLoaded: false,
    listsLoaded: false,
    categoriesLoaded: false,
    subcategoriesLoaded: false,
    industriesLoaded: false,
    companiesLoaded: false,
    phrasesLoaded: false,
    procurementTargetsLoaded: false,
    dbReady: null, // null = tuntematon, false = ei kaytossa, true = kaytossa
    editingCategoryId: null,
    editingSubcategoryId: null,
    editingIndustryId: null,
    editingCompanyId: null,
    editingPhraseId: null,
    editingProcurementTargetId: null,
    addWizardStep: 1,
    addWizardMaxStep: 1,
    addWizardMode: null,
    addWizardEditingId: null,
    addEditSearch: "",
    addEditCategoryFilter: [],
    addEditSubcategoryFilter: [],

  function isUserTyping() {
    // Ei keskeytetä pollauksen aikaista uudelleenrenderöintiä, jos käyttäjä
    // on kesken kirjoittamassa tekstikenttään tai valitsemassa <select>-arvoa.
    var el = document.activeElement;
    if (!el) return false;
    var tag = el.tagName;
    return tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && el.type !== "checkbox" && el.type !== "radio");
  }

  // Onko jossain lisäyslomakkeessa tallentamatonta sisältöä? Estää
  // pollausta nollaamasta keskeneräistä lomaketta.
  function hasUnsavedFormInput() {
    var forms = ["addForm", "addCategoryForm", "addSubcategoryForm", "addIndustryForm", "addCompanyForm", "addPhraseForm"];
    var formsHaveInput = forms.some(function (id) {
      var form = document.getElementById(id);
      if (!form) return false;
      return Array.prototype.some.call(form.querySelectorAll("input[type='text'], textarea"), function (el) {
        return el.value.trim() !== "";
      }) || Array.prototype.some.call(form.querySelectorAll("select"), function (el) {
        return el.value !== "";
      });
    });
    if (formsHaveInput) return true;
    var addFormEl = document.getElementById("addForm");
    if (addFormEl) {
      var ptHiddenInput = addFormEl.querySelector('input[type="hidden"][name="procurementTargets"]');
      if (ptHiddenInput && ptHiddenInput.value.trim() !== "") return true;
    }
    // Hankinnan kohteiden lisäysrivejä on yksi per Omistaja, joten ne
    // tarkistetaan luokan perusteella.
    return Array.prototype.some.call(document.querySelectorAll(".procurement-target-new-input"), function (el) {

  function getApiKey() {
    try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) { return ""; }
  }

  function setApiKey(key) {
    try {
      if (key) localStorage.setItem(API_KEY_STORAGE, key);
      else localStorage.removeItem(API_KEY_STORAGE);
    } catch (e) { /* localStorage ei käytössä, jatketaan ilman tallennusta */ }
  }

  async function apiFetch(url, options) {
    var headers = { "Content-Type": "application/json" };
    var key = getApiKey();
    if (key) headers["X-API-Key"] = key;
    var res = await fetch(API + url, Object.assign({ headers: headers }, options));
    if (res.status === 401) {
      var body = await res.json().catch(function () { return {}; });
      var err = new Error(body.error || "API-avain vaaditaan");
      err.status = 401;
      throw err;
    }
    if (!res.ok) {
      var body2 = await res.json().catch(function () { return {}; });
      var err2 = new Error(body2.error || ("API-virhe " + res.status + ": " + url));
      err2.status = res.status;
      throw err2;
    }
    if (res.status === 204) return null;
    return res.json();
  }

  // eri nimet aakkosjärjestyksessä.
  function distinctFieldNames(field) {
    var seen = {};
    var names = [];
    state.requirements.forEach(function (r) {
      var v = r[field];
      if (v && !seen[v]) { seen[v] = true; names.push(v); }
    });
    return names.sort(sortFi);
  }

    return state.subcategories.map(function (s) { return s.name; }).sort(sortFi);

  // Vaihtoehdot <select>-kenttään. Jos nykyinen arvo ei enää ole hallitussa
  // listassa (esim. kategoria poistettu), se säilytetään valittuna vaihtoehtona,
  // ettei olemassa olevan vaatimuksen tieto katoa huomaamatta.
  function categoryOptionsForSelect(selected) {
    var cats = managedCategoryNames();
    if (selected && cats.indexOf(selected) === -1) {
      cats.push(selected);
      cats.sort(sortFi);
    }
    var html = '<option value="" disabled' + (selected ? "" : " selected") + '>Valitse kategoria</option>';
    html += cats.map(function (c) {
      return '<option value="' + escapeHtml(c) + '"' + (c === selected ? " selected" : "") + ">" + escapeHtml(c) + "</option>";
    }).join("");
    return html;
  }

    var total = reqs.length;
    var now = new Date();
    var monthKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    var yearKey = String(now.getFullYear());
    var monthCount = reqs.filter(function (r) { return (r.createdAt || "").slice(0, 7) === monthKey; }).length;
    var yearCount = reqs.filter(function (r) { return (r.createdAt || "").slice(0, 4) === yearKey; }).length;

    var counts = {};
    reqs.forEach(function (r) {
      var cat = r.category || "Ei kategoriaa";
      counts[cat] = (counts[cat] || 0) + 1;
    });

      return { name: name, count: counts[name] };
    }).sort(function (a, b) { return b.count - a.count; });
    var topCats = catList.slice(0, HOME_TOP_CATEGORIES);
    var restCats = catList.slice(HOME_TOP_CATEGORIES);

      '<div class="home-hero">' +
        "<h1>Mikä on HARAVA?</h1>" +
        '<p class="lede">HARAVA (Hankintojen rakenteelliset vaatimukset) on yhteinen työkalu, jolla useampi käyttäjä kokoaa ja hallitsee hankintojen ja tarjouspyyntöjen vaatimuksia samassa paikassa. Vaatimukset kirjataan kirjastoon, luokitellaan kategorioihin ja omistajiin, ja yhdistetään valmiiksi dokumenteiksi, jotka voi tulostaa osaksi tarjouspyyntöä. Näin sama vaatimus kirjoitetaan kerran huolellisesti ja käytetään sitten uudelleen aina, kun sitä tarvitaan.</p>' +
      "</div>" +

            return '<button type="button" class="home-card" data-action="nav" data-view="' + a.view + '">' +
              '<div class="home-card-num">' + a.num + "</div>" +
              '<div class="home-card-title">' + escapeHtml(a.title) + "</div>" +
              '<p class="home-card-lede">' + escapeHtml(a.lede) + "</p>" +
            "</button>";
          }).join("") +
        "</div>" +
        '<div class="home-stats">' +
          '<div class="home-stat"><div class="n">' + total + '</div><div class="label">Vaatimuksia yhteensä</div></div>' +
          '<div class="home-stat"><div class="n">+' + monthCount + '</div><div class="label">Tässä kuussa</div></div>' +
          '<div class="home-stat"><div class="n">+' + yearCount + '</div><div class="label">Tänä vuonna</div></div>' +
        "</div>" +
        (catList.length > 0
          ? '<div class="home-cats">' +
              topCats.map(function (c) {
                var pct = maxCount > 0 ? Math.round((c.count / maxCount) * 100) : 0;
                return '<div class="home-cat-row">' +
                  '<span class="home-cat-name">' + escapeHtml(c.name) + "</span>" +
                  '<span class="home-cat-bar-track"><span class="home-cat-bar-fill" style="width:' + pct + '%"></span></span>' +
                  '<span class="home-cat-count">' + c.count + "</span>" +
                "</div>";
              }).join("") +
              (restCount > 0
                ? '<div class="home-cat-row home-cat-row-rest">' +
                    '<span class="home-cat-name">Muut (' + restCats.length + ')</span>' +
                    '<span class="home-cat-bar-track"><span class="home-cat-bar-fill" style="width:' + (maxCount > 0 ? Math.round((restCount / maxCount) * 100) : 0) + '%"></span></span>' +
                    '<span class="home-cat-count">' + restCount + "</span>" +
                  "</div>"
                : "") +
            "</div>"
          : "") +
      "</div>"
    );

  var ADD_WIZARD_STEPS = [

  ];

  function addWizardRailStepState(step) {
    var current = state.addWizardStep || 1;
    var maxStep = state.addWizardMaxStep || 1;
    if (step === current) return "active";
    if (step <= maxStep) return "done";
    return "pending";
  }

  function addWizardStepSummary(step) {
    if (step !== 1) return "";
    if (state.addWizardMode === "new") return "Uusi vaatimus";
    if (state.addWizardMode === "edit") {
      var r = state.requirements.find(function (x) { return x.id === state.addWizardEditingId; });
      if (!r) return "Muokataan vaatimusta";
      return r.text.length > 50 ? r.text.slice(0, 50) + "…" : r.text;
    }
    return "";
  }

  function addWizardRailHtml() {
    return (
      '<div class="add-wizard-rail-h" id="addWizardRail">' +
        ADD_WIZARD_STEPS.map(function (s, idx) {
          var st = addWizardRailStepState(s.step);
          var summary = addWizardStepSummary(s.step);
          var stepHtml = (
            '<div class="add-wizard-rail-step ' + st + '"' + (st !== "pending" ? ' data-action="add-wizard-goto-step" data-step="' + s.step + '"' : "") + '>' +
              '<span class="circle">' + (st === "done" ? "✓" : s.step) + "</span>" +
              '<div class="rail-step-text">' +
                '<span class="label">' + escapeHtml(s.label) + "</span>" +
                (summary ? '<span class="step-summary">' + escapeHtml(summary) + "</span>" : "") +
              "</div>" +
            "</div>"
          );
          var isLast = idx === ADD_WIZARD_STEPS.length - 1;
          var connectorHtml = isLast ? "" : '<div class="rail-connector' + (st === "done" ? " done" : "") + '"></div>';
          return stepHtml + connectorHtml;
        }).join("") +
      "</div>"
    );
  }

  function filteredRequirements() {
    var q = state.libSearch.trim().toLowerCase();
    var catFilter = state.libCategoryFilter;
    var indFilter = state.libIndustryFilter;
    var subFilter = state.libSubcategoryFilter;
    var createdByFilter = state.libCreatedByFilter;
    var updatedByFilter = state.libUpdatedByFilter;
    return state.requirements.filter(function (r) {
      if (catFilter.length && catFilter.indexOf(r.category) === -1) return false;
      if (indFilter.length && indFilter.indexOf(r.industry) === -1) return false;
      if (subFilter.length && subFilter.indexOf(r.subcategory || "") === -1) return false;
      if (createdByFilter.length && createdByFilter.indexOf(r.createdBy || "") === -1) return false;
      if (updatedByFilter.length && updatedByFilter.indexOf(r.updatedBy || "") === -1) return false;
      if (!matchesProcurementTargetFilter(r, state.libProcurementTargetFilter)) return false;
      if (!matchesTimeFilter(r, state.libTimeFilter)) return false;
      if (q && !(r.text || "").toLowerCase().includes(q) && !(r.industry || "").toLowerCase().includes(q)) return false;
      return true;
    });
  }

  // Alakategorian mukaan järjestettäessä tyhjä arvo on aina viimeisenä.
  function compareSubcategory(a, b, desc) {
    if (a === "" && b === "") return 0;
    if (a === "") return 1;
    if (b === "") return -1;
    return desc ? sortFi(b, a) : sortFi(a, b);
  }

  // Järjestää vaatimukset valitun kentän ja suunnan mukaan. Tyhjä valinta
  // säilyttää lisäysjärjestyksen.
  function sortRequirementsForDisplay(arr) {
    var mode = state.libSort;
    if (!mode) return arr;
    var sorted = arr.slice();
    if (mode === "createdAt-asc") {
      sorted.sort(function (a, b) { return (a.createdAt || "").localeCompare(b.createdAt || ""); });
    } else if (mode === "createdAt-desc") {
      sorted.sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
    } else if (mode === "text-asc") {
      sorted.sort(function (a, b) { return sortFi(a.text || "", b.text || ""); });
    } else if (mode === "text-desc") {
      sorted.sort(function (a, b) { return sortFi(b.text || "", a.text || ""); });
    } else if (mode === "category-asc") {
      sorted.sort(function (a, b) { return sortFi(a.category || "", b.category || ""); });
    } else if (mode === "category-desc") {
      sorted.sort(function (a, b) { return sortFi(b.category || "", a.category || ""); });
    } else if (mode === "subcategory-asc") {
      sorted.sort(function (a, b) { return compareSubcategory(a.subcategory || "", b.subcategory || "", false); });
    } else if (mode === "subcategory-desc") {
      sorted.sort(function (a, b) { return compareSubcategory(a.subcategory || "", b.subcategory || "", true); });
    }
    return sorted;
  }

  // Onko haku tai jokin suodatin päällä?
  function libraryFilterActive() {
    return !!(state.libSearch.trim() || state.libCategoryFilter.length || state.libIndustryFilter.length ||
      state.libSubcategoryFilter.length || state.libCreatedByFilter.length || state.libUpdatedByFilter.length ||
      state.libProcurementTargetFilter.length || timeFilterActive(state.libTimeFilter));
  }

  // Kirjaston tuloslista: tasainen, valitun järjestyksen mukainen
  // korttilista.
  function libraryListHtml() {
    var list = filteredRequirements();
    if (list.length === 0) {
      return state.requirements.length === 0
        ? '<div class="empty-state">Vaatimuskirjasto on tyhjä. Lisää ensimmäinen vaatimus yllä olevalla lomakkeella.</div>'
        : '<div class="empty-state">Hakuehtoihin ei löytynyt vaatimuksia.</div>';
    }
    var rows = sortRequirementsForDisplay(list);
    return '<ol class="req-cards">' + rows.map(reqRowHtml).join("") + "</ol>";
  }

  // Vaatimuksen tyyppi: pakollinen/valinnainen/pisteytettävä. Jos
  // type-kenttä puuttuu, tyyppi johdetaan mandatory-kentästä.
  var REQ_TYPES = [
    { value: "mandatory", label: "Pakollinen" },
    { value: "optional", label: "Valinnainen" },
    { value: "scored", label: "Pisteytettävä" }
  ];
  function reqType(r) {
    return r.type || (r.mandatory ? "mandatory" : "optional");
  }
  function reqTypeLabel(type) {
    var found = REQ_TYPES.filter(function (t) { return t.value === type; })[0];
    return found ? found.label : "Valinnainen";
  }
  // Tyyppivalinta on/off-painikkeina (yksi aktiivinen). Arvo välittyy
  // FormData:an piilotetun kentän kautta.
  function reqTypeToggleButtonsHtml(hiddenName, selectedType) {
    return (
      '<div class="filter-buttons req-type-toggle">' +
        REQ_TYPES.map(function (t) {
          return '<button type="button" class="filter-toggle-btn' + (selectedType === t.value ? " active" : "") + '" data-action="select-req-type" data-value="' + t.value + '">' + escapeHtml(t.label) + "</button>";
        }).join("") +
        '<input type="hidden" name="' + hiddenName + '" value="' + selectedType + '">' +
      "</div>"
    );
  }

  // Vaatimuksen hankinnan kohteet: monivalinta vaatimuksen Omistajan
  // kohteista. Valinnat tallennetaan piilotettuun kenttään pilkuilla
  // eroteltuna (ks. "toggle-procurement-target").
  function procurementTargetToggleGroupHtml(industryName, selectedNames) {
    var selected = selectedNames || [];
    if (!industryName) {
      return '<p class="hint" style="font-size:12.5px;color:var(--muted);margin:0">Valitse ensin Omistaja.</p>' +
        '<input type="hidden" name="procurementTargets" value="">';
    }
    var names = procurementTargetsForIndustry(industryName).map(function (t) { return t.name; });
    if (names.length === 0) {
      return '<p class="hint" style="font-size:12.5px;color:var(--muted);margin:0">Omistajalla "' + escapeHtml(industryName) + '" ei ole vielä hankinnan kohteita. Lisää niitä Hallinta → Hankinnan kohteet -välilehdellä.</p>' +
        '<input type="hidden" name="procurementTargets" value="">';
    }
    return (
      '<input type="hidden" name="procurementTargets" value="' + escapeHtml(selected.join(",")) + '">' +
      '<div class="filter-buttons">' +
        names.map(function (n) {
          var active = selected.indexOf(n) !== -1;
          return '<button type="button" class="filter-toggle-btn' + (active ? " active" : "") + '" data-action="toggle-procurement-target" data-value="' + escapeHtml(n) + '">' + escapeHtml(n) + "</button>";
        }).join("") +
      "</div>"
    );
  }

  // Dokumentin hankinnan kohteet. Jos procurementTargets-taulukkoa ei ole,
  // luetaan yksittäisarvoinen procurementTarget-kenttä.
  function listProcurementTargets(list) {
    if (list.procurementTargets) return list.procurementTargets;
    return list.procurementTarget ? [list.procurementTarget] : [];
  }

  // Dokumentin hankinnan kohteet: hakukombo kaikkien Omistajien kohteista.
  // Kirjoittaminen suodattaa osumat (nimi + Omistaja), valinta lisää
  // kohteen valittujen riville ja tyhjentää haun. Jo valitut eivät näy
  // osumissa.
  function procurementTargetChipsHtml(selectedNames) {
    if (!selectedNames || selectedNames.length === 0) {
      return '<span class="empty-hint">Ei valittuja hankinnan kohteita.</span>';
    }
    return selectedNames.map(function (n) {
      return '<span class="sel-chip">' + escapeHtml(n) + '<button type="button" data-action="remove-list-procurement-target" data-value="' + escapeHtml(n) + '" title="Poista" aria-label="Poista">✕</button></span>';
    }).join("");
  }

  function procurementTargetComboMatches(query, selectedNames) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return state.procurementTargets.filter(function (t) {
      return selectedNames.indexOf(t.name) === -1 && t.name.toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return sortFi(a.name, b.name); });
  }

  function procurementTargetDropdownOptionsHtml(matches) {
    return matches.map(function (t) {
      return '<div class="combo-option" data-action="pick-list-procurement-target" data-value="' + escapeHtml(t.name) + '"><span>' + escapeHtml(t.name) + '</span><span class="owner-hint">' + escapeHtml(t.industry) + "</span></div>";
    }).join("");
  }

  function procurementTargetComboHtml(selectedNames) {
    if (state.procurementTargets.length === 0) {
      return '<p class="hint" style="font-size:12.5px;color:var(--muted);margin:0">Hankinnan kohteita ei ole vielä lisätty. Lisää niitä Hallinta → Hankinnan kohteet -välilehdellä.</p>';
    }
    return (
      '<div class="selected-row" id="listProcurementTargetChips">' + procurementTargetChipsHtml(selectedNames) + "</div>" +
      '<div class="combo-wrap">' +
        '<input type="text" id="listProcurementTargetSearch" placeholder="Kirjoita hakeaksesi hankinnan kohteita…" autocomplete="off">' +
        '<div class="combo-dropdown" id="listProcurementTargetDropdown" hidden></div>' +
      "</div>"
    );
  }

  // Kategoria- ja alakategoriamerkin väri lasketaan nimestä, joten sama
  // nimi saa aina saman värin.
  var HUE_COUNT = 8;
  function hueIndexForName(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return hash % HUE_COUNT;
  }
  function hueChipHtml(name) {
    return '<span class="req-chip" style="--chip-color:var(--hue-' + hueIndexForName(name) + ')">' + escapeHtml(name) + "</span>";
  }

  // Vaatimuskortin runko (.req-card-top:n alapuolinen osa), yhteinen
  // reqRowHtml():lle ja addWizardExistingCardHtml():lle.
  function reqCardBodyPartsHtml(r) {
    var attributionParts = [];
    if (r.createdBy) attributionParts.push("Lisäsi " + escapeHtml(r.createdBy) + " " + fmtDate(r.createdAt));
    if (r.updatedBy) attributionParts.push("Muokkasi viimeksi " + escapeHtml(r.updatedBy) + " " + fmtDate(r.updatedAt));
    var attributionHtml = attributionParts.length > 0 ? '<span class="req-card-attribution">' + attributionParts.join(" · ") + "</span>" : "";
    var chips = [];
    if (r.category) chips.push(hueChipHtml(r.category));
    if (r.subcategory) chips.push(hueChipHtml(r.subcategory));
    if (r.industry) chips.push('<span class="req-chip req-chip-owner">' + escapeHtml(r.industry) + "</span>");
    var chipsHtml = chips.length > 0 ? '<div class="req-card-chips">' + chips.join("") + "</div>" : "";
    return (
      procurementTargetPillRowHtml(r.procurementTargets) +
      '<p class="req-card-text">' + escapeHtml(r.text) + "</p>" +
      reqExtraLineHtml("Tarkennus/perustelu", r.note) +
      reqExtraLineHtml("Hyväksyntäehto", r.acceptanceCondition) +
      chipsHtml +
      attributionHtml
    );
  }

  function reqRowHtml(r) {
    var type = reqType(r);
    return (
      '<li class="req-card ' + type + '" data-id="' + r.id + '">' +
        '<div class="req-card-top">' +
          '<span class="req-type-label ' + type + '">' + reqTypeLabel(type) + "</span>" +
        "</div>" +
        reqCardBodyPartsHtml(r) +
      "</li>"
    );
  }

  // Osallistun vaiheen 1 hakutulos: "Muokkaa tätä" lataa vaatimuksen
  // lomakkeelle (ks. "add-wizard-pick-existing"), lisäksi poisto.
  function addWizardExistingCardHtml(r) {
    var type = reqType(r);
    return (
      '<li class="req-card ' + type + '" data-id="' + r.id + '">' +
        '<div class="req-card-top">' +
          '<span class="req-type-label ' + type + '">' + reqTypeLabel(type) + "</span>" +
          '<div class="req-card-pick-actions">' +
            '<button type="button" class="btn small primary" data-action="add-wizard-pick-existing" data-id="' + r.id + '">Muokkaa tätä</button>' +
            '<button type="button" class="delete-existing-btn" data-action="delete-req" data-id="' + r.id + '" title="Poista" aria-label="Poista">✕</button>' +
          "</div>" +
        "</div>" +
        reqCardBodyPartsHtml(r) +
      "</li>"
    );
  }

    var el = document.getElementById("libraryList");
    if (el) el.innerHTML = libraryListHtml();

  // ---------- Näkymä: Hallinta (taustatiedot välilehtinä) ----------

    { view: "categories", label: "Kategoriat", helpAnchor: "ohje-kategoriat" },
    { view: "subcategories", label: "Alakategoriat", helpAnchor: "ohje-alakategoriat" },
    { view: "industries", label: "Omistajat", helpAnchor: "ohje-omistajat" },
    { view: "procurementTargets", label: "Hankinnan kohteet", helpAnchor: "ohje-hankinnan-kohteet" },
    { view: "companies", label: "Yritykset", helpAnchor: "ohje-yritykset" },
    { view: "phrases", label: "Fraasit", helpAnchor: "ohje-fraasit" }
  ];

  // Seed-alustuksen tulosraportti, näkyvissä kunnes käyttäjä sulkee sen.
  var SEED_RESULT_LABELS = [
    { key: "categories", label: "Kategoriat" },
    { key: "subcategories", label: "Alakategoriat" },
    { key: "industries", label: "Omistajat" },
    { key: "phrases", label: "Fraasit" }
  ];

  function seedResultHtml() {
    var r = state.seedResult;
    if (!r) return "";
    return (
      '<div class="result-card">' +
        '<div class="result-card-head">' +
          '<span class="result-card-title">Alustuksen tulos</span>' +
          '<button type="button" class="btn small ghost" data-action="close-seed-result">Sulje</button>' +
        "</div>" +
        SEED_RESULT_LABELS.map(function (l) {
          var part = r[l.key];
          if (!part) return "";
          var line = escapeHtml(l.label) + ": " + part.added + " lisätty";
          if (part.skipped && part.skipped.length > 0) {
            line += ", " + part.skipped.length + " ohitettu (jo olemassa: " + part.skipped.map(escapeHtml).join(", ") + ")";
          }
          return '<p class="result-card-line">' + line + "</p>";
        }).join("") +
      "</div>"
    );
  }

  function tplAdmin() {
    var active = ADMIN_TABS.filter(function (t) { return t.view === state.view; })[0] || ADMIN_TABS[0];
    var content = active.view === "categories" ? tplCategories()
      : active.view === "subcategories" ? tplSubcategories()
      : active.view === "industries" ? tplIndustries()
      : active.view === "procurementTargets" ? tplProcurementTargets()
      : active.view === "companies" ? tplCompanies()
      : tplPhrases();
    return (
      '<div class="view-header">' +
        "<h1>Miten mukautan ympäristöä?</h1>" +
        '<p class="lede">' + homeActionLede("categories") + "</p>" +
      "</div>" +
      '<div style="margin-bottom:20px">' +
        '<button type="button" class="btn" data-action="seed-defaults"' + (isReadOnly() || isNoAdmin() ? " disabled" : "") + '>Alusta oletustaustatiedoilla</button>' +
      "</div>" +
      (state.seedResult ? seedResultHtml() : "") +
      '<nav class="tabs admin-tabs">' +
        ADMIN_TABS.map(function (t) {
          return '<button type="button" class="tab' + (t.view === active.view ? " active" : "") + '" data-action="nav" data-view="' + t.view + '">' + escapeHtml(t.label) + "</button>";
        }).join("") +

      '<div id="adminTabContent">' + content + "</div>"

  function tplCategories() {
    if (!state.categoriesLoaded) return '<p style="color:var(--muted)">Ladataan…</p>';

      '<p class="lede" style="margin-bottom:24px">Hallitse vaatimuskirjaston kategorioita tässä. Muualla vaatimuksen kategoria valitaan tästä listasta.</p>' +

        '<div class="field-row">' +
          "<label>Uusi kategoria</label>" +
          '<input type="text" name="name" required placeholder="Esim. Laatu" autocomplete="off">' +

      "</form>" +
      '<div id="categoryMessage"></div>' +

  function categoryRowHtml(c) {

      return (
        '<div class="list-card" data-id="' + c.id + '">' +

        '<div class="meta">' +
          "<h3>" + escapeHtml(c.name) + "</h3>" +

        "</div>" +
      "</div>"

  function procurementTargetGroupHtml(ind) {

      '<div class="owner-target-group">' +
        '<div class="owner-target-head">' +

  // Järjestysvalikko suodatinkortin otsikkorivillä (ks. libSortSelectHtml()).
  var PHRASE_SORT_OPTIONS = [
    { value: "", label: "Teksti A→Ö" },
    { value: "text-desc", label: "Teksti Ö→A" },
    { value: "category-asc", label: "Kategoria A→Ö" },

  function phraseSortSelectHtml() {

        PHRASE_SORT_OPTIONS.map(function (o) {

    );

  function filteredPhrases() {
    var q = state.phraseSearch.trim().toLowerCase();
    var catFilter = state.phraseCategoryFilter;
    var subFilter = state.phraseSubcategoryFilter;
    return state.phrases.filter(function (p) {
      if (catFilter.length && catFilter.indexOf(p.category || "") === -1) return false;
      if (subFilter.length && subFilter.indexOf(p.subcategory || "") === -1) return false;
      if (q && !(p.text || "").toLowerCase().includes(q)) return false;
      return true;
    });
  }

  // Oletus on teksti A→Ö. Kategoria- ja alakategoriajärjestyksessä
  // teksti on toissijainen järjestysperuste.
  function sortPhrasesForDisplay(arr) {
    var mode = state.phraseSort;
    var sorted = arr.slice();
    if (mode === "text-desc") {
      sorted.sort(function (a, b) { return sortFi(b.text || "", a.text || ""); });
    } else if (mode === "category-asc") {
      sorted.sort(function (a, b) { return sortFi(a.category || "", b.category || "") || sortFi(a.text || "", b.text || ""); });
    } else if (mode === "category-desc") {
      sorted.sort(function (a, b) { return sortFi(b.category || "", a.category || "") || sortFi(a.text || "", b.text || ""); });
    } else if (mode === "subcategory-asc") {
      sorted.sort(function (a, b) { return sortFi(a.subcategory || "", b.subcategory || "") || sortFi(a.text || "", b.text || ""); });
    } else if (mode === "subcategory-desc") {
      sorted.sort(function (a, b) { return sortFi(b.subcategory || "", a.subcategory || "") || sortFi(a.text || "", b.text || ""); });
    } else {
      sorted.sort(function (a, b) { return sortFi(a.text || "", b.text || ""); });
    }
    return sorted;
  }
