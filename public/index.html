      '<select id="listsSortSelect" class="header-sort-select" data-action="noop" title="Järjestä tulokset">' +
        LISTS_SORT_OPTIONS.map(function (o) {
          return '<option value="' + o.value + '"' + (state.listsSort === o.value ? " selected" : "") + ">" + escapeHtml(o.label) + "</option>";
        }).join("") +
      "</select>"
    );
  }

  function filteredLists() {
    var companyFilter = state.listsCompanyFilter;
    var q = state.listsContactSearch.trim().toLowerCase();
    return state.lists.filter(function (l) {
      if (companyFilter.length && companyFilter.indexOf(companyNameById(l.companyId || "")) === -1) return false;
      if (q) {
        var hay = [l.name, l.contactName, l.contactPhone, l.contactEmail].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function sortListsForDisplay(arr) {
    var mode = state.listsSort;
    if (!mode) return arr;
    var sorted = arr.slice();
    if (mode === "createdAt-asc") {
      sorted.sort(function (a, b) { return (a.createdAt || "").localeCompare(b.createdAt || ""); });
    } else if (mode === "createdAt-desc") {
      sorted.sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
    } else if (mode === "name-asc") {
      sorted.sort(function (a, b) { return sortFi(a.name || "", b.name || ""); });
    } else if (mode === "name-desc") {
      sorted.sort(function (a, b) { return sortFi(b.name || "", a.name || ""); });
    }
    return sorted;
  }

  function companyNameById(id) {
    var c = state.companies.find(function (x) { return x.id === id; });
    return c ? c.name : "";
  }

  function rerenderListsRegister() {
    var el = document.getElementById("listsRegister");
    if (el) el.innerHTML = listsListHtml();
  }

  function listCardHtml(l) {
    var count = (l.itemIds || []).length;
    var checked = state.selectedListIds.indexOf(l.id) !== -1;
    var companyName = l.companyId ? companyNameById(l.companyId) : "";
    var metaParts = [count + " vaatimusta"];
    if (companyName) metaParts.push(companyName);
    metaParts.push("päivitetty " + fmtDate(l.updatedAt || l.createdAt));
    var contactParts = [l.contactName, l.contactPhone, l.contactEmail].filter(Boolean);
    var contactHtml = contactParts.length > 0
      ? "<p>Yhteyshenkilö: " + contactParts.map(escapeHtml).join(" · ") + "</p>"
      : "";
    return (
      '<div class="list-card">' +
        '<div class="list-card-main">' +
          '<input type="checkbox" class="pick-checkbox" data-action="toggle-list-select" data-id="' + l.id + '"' + (checked ? " checked" : "") + (count === 0 ? " disabled" : "") + ' title="Valitse tulostettavaksi useamman dokumentin joukossa">' +
          '<div class="meta">' +
            "<h3>" + escapeHtml(l.name || "Nimetön dokumentti") + "</h3>" +
            "<p>" + metaParts.map(escapeHtml).join(" · ") + "</p>" +
            contactHtml +
          "</div>" +
        "</div>" +
        '<div class="actions">' +
          '<button type="button" class="btn small" data-action="open-list" data-id="' + l.id + '">Avaa</button>' +
          '<button type="button" class="btn small" data-action="print-list" data-id="' + l.id + '"' + (count === 0 ? " disabled" : "") + ">Esikatselu</button>" +
          '<button type="button" class="btn small danger" data-action="delete-list" data-id="' + l.id + '">Poista</button>' +
        "</div>" +
      "</div>"
    );
  }

  // Dokumenttilistaus tasaisena korttilistana.
  function listsListHtml() {
    if (state.lists.length === 0) {
      return '<div class="empty-state">Dokumentteja ei ole vielä luotu. Aloita painamalla “Uusi dokumentti”.</div>';
    }
    var filtered = filteredLists();
    if (filtered.length === 0) {
      return '<div class="empty-state">Hakuehtoihin ei löytynyt dokumentteja.</div>';
    }
    return sortListsForDisplay(filtered).map(listCardHtml).join("");
  }

  // ---------- Näkymä: Editori ----------
  function currentList() {
    return state.lists.find(function (l) { return l.id === state.currentListId; });
  }

  function tplEditor() {
    var list = currentList();
    if (!list) {
      return '<div class="empty-state">Dokumenttia ei löytynyt. Se on saatettu poistaa.</div><p style="margin-top:14px"><button class="btn" data-action="back-to-lists">← Takaisin dokumentteihin</button></p>';
    }
    return (
      '<div class="editor-toolbar">' +
        '<button type="button" class="btn" data-action="back-to-lists">← Dokumentit</button>' +
      "</div>" +
      '<div class="editor-head">' +
        '<div class="field-row">' +
          "<label>Dokumentin nimi</label>" +
          '<input type="text" id="listName" value="' + escapeHtml(list.name || "") + '" placeholder="Dokumentin nimi">' +
        "</div>" +
        '<div class="field-row">' +
          "<label>Muistiinpanot</label>" +
          '<textarea id="listNotes" rows="1" placeholder="Esim. hankinnan nimi, päivämäärä tai muu merkintä">' + escapeHtml(list.notes || "") + "</textarea>" +
        "</div>" +
        '<div class="field-row">' +
          "<label>Hankinnan kohteet</label>" +
          '<div id="listProcurementTargetPicker">' + procurementTargetComboHtml(listProcurementTargets(list)) + "</div>" +
        "</div>" +
        '<div class="contact-row">' +
          '<div class="field-row"><label>Yhteyshenkilön nimi</label><input type="text" id="listContactName" value="' + escapeHtml(list.contactName || "") + '"></div>' +
          '<div class="field-row"><label>Puhelinnumero</label><input type="text" id="listContactPhone" value="' + escapeHtml(list.contactPhone || "") + '"></div>' +
          '<div class="field-row"><label>Sähköpostiosoite</label><input type="email" id="listContactEmail" value="' + escapeHtml(list.contactEmail || "") + '"></div>' +
        "</div>" +
        '<div class="field-row">' +
          "<label>Yritys (dokumentin laatija)</label>" +
          '<select id="listCompany">' +
            companyOptionsForSelect(list.companyId || "") +
          "</select>" +
        "</div>" +
        '<div class="editor-head-actions">' +
          '<button type="button" class="btn primary" data-action="print-list" data-id="' + list.id + '"' + ((list.itemIds || []).length === 0 ? " disabled" : "") + ">Esikatselu / Tulosta</button>" +
          '<button type="button" class="btn danger" data-action="delete-list" data-id="' + list.id + '">Poista dokumentti</button>' +
        "</div>" +
      "</div>" +
      '<div id="editorSections">' + editorSectionsHtml(list) + "</div>"
    );
  }

  // Editorin avattava "Hakuehdot ja suodattimet" -osio. Oletuksena auki
  // (state.editorSectionOpen), palautuu auki-tilaan kun toinen dokumentti
  // avataan.
  function editorSectionHtml(key, title, bodyHtml, badgeHtml) {
    var recorded = state.editorSectionOpen[key];
    var isOpen = (recorded === null || recorded === undefined) ? true : recorded;
    return (
      '<div class="cat-card section-card editor-section' + (isOpen ? " open" : "") + '" data-key="' + key + '">' +
        '<div class="cat-head" data-action="toggle-editor-section" data-id="' + key + '">' +
          '<span class="cat-name">' + escapeHtml(title) + "</span>" +
          (badgeHtml || "") +
        "</div>" +
        (isOpen ? '<div class="cat-body">' + bodyHtml + "</div>" : "") +
      "</div>"
    );
  }

  // Onko haku tai jokin suodatin päällä? Ohjaa kortin "käytössä"/"ei
  // käytössä" -merkintää.
  function editorFiltersActive() {
    return !!(state.editorSearch.trim() || state.editorCategoryFilter.length || state.editorSubcategoryFilter.length || state.editorIndustryFilter.length || state.editorProcurementTargetFilter.length || timeFilterActive(state.editorTimeFilter));
  }

  function updateEditorFiltersActiveBadge() {
    var el = document.getElementById("editorFiltersActiveBadge");
    if (el) el.textContent = editorFiltersActive() ? "käytössä" : "ei käytössä";
  }

  // Hakuehdot-kortin alla välilehdet "Valittavat" ja "Valitut"; vain
  // aktiivinen (state.editorTab) renderöidään.
  function editorSectionsHtml(list) {
    return (
      editorSectionHtml(
        "search",
        "Hakuehdot ja suodattimet",
        '<div id="editorSearchSectionBody">' + editorSearchSectionBodyHtml() + "</div>",
        '<span class="count" id="editorFiltersActiveBadge">' + (editorFiltersActive() ? "käytössä" : "ei käytössä") + "</span>"
      ) +
      '<div id="editorTabsBar">' + editorTabsHtml(list) + "</div>" +
      '<div id="editorTabPanels">' + editorTabPanelHtml(list) + "</div>"
    );
  }

  function rerenderEditorSections() {
    var list = currentList();
    var el = document.getElementById("editorSections");
    if (el && list) el.innerHTML = editorSectionsHtml(list);
  }

  // Päivittää välilehtirivin ja aktiivisen välilehden sisällön ilman koko
  // #editorSections-alueen uudelleenrakennusta.
  function editorTabsHtml(list) {
    var tab = state.editorTab || "available";
    var availableCount = editorAvailablePool(list).length;
    var selectedCount = (list.itemIds || []).length;
    return (
      '<div class="tabs editor-tabs">' +
        '<button type="button" class="tab' + (tab === "available" ? " active" : "") + '" data-action="select-editor-tab" data-id="available">Valittavat <span class="count" id="editorAvailableCount">(' + availableCount + ")</span></button>" +
        '<button type="button" class="tab' + (tab === "selected" ? " active" : "") + '" data-action="select-editor-tab" data-id="selected">Valitut <span class="count" id="editorSelectedCount">(' + selectedCount + ")</span></button>" +
      "</div>"
    );
  }

  function editorTabPanelHtml(list) {
    return (state.editorTab === "selected") ? selectionListHtml(list) : editorAvailableListHtml(list);
  }

  function rerenderEditorTabArea() {
    var list = currentList();
    if (!list) return;
    var tabsBar = document.getElementById("editorTabsBar");
    if (tabsBar) tabsBar.innerHTML = editorTabsHtml(list);
    var panels = document.getElementById("editorTabPanels");
    if (panels) panels.innerHTML = editorTabPanelHtml(list);
  }

  // "Hakuehdot ja suodattimet" -osion sisältö: välilehti per ulottuvuus,
  // vain aktiivinen renderöidään.
  var EDITOR_FILTER_TABS = [
    { key: "category", label: "Kategoria" },
    { key: "subcategory", label: "Alakategoria" },
    { key: "industry", label: "Omistaja" },
    { key: "procurementTarget", label: "Hankinnan kohde" },
    { key: "time", label: "Ajan mukaan" },
    { key: "search", label: "Hakusana" }
  ];

  function editorFilterTabCount(key) {
    if (key === "category") return state.editorCategoryFilter.length;
    if (key === "subcategory") return state.editorSubcategoryFilter.length;
    if (key === "industry") return state.editorIndustryFilter.length;
    if (key === "procurementTarget") return state.editorProcurementTargetFilter.length;
    if (key === "time") return timeFilterCount(state.editorTimeFilter);
    return 0;
  }

  function editorSearchSectionBodyHtml() {
    var active = state.editorFilterTab || "category";
    return (
      '<div class="filter-tabs">' +
        EDITOR_FILTER_TABS.map(function (t) {
          var count = editorFilterTabCount(t.key);
          return (
            '<button type="button" class="filter-tab' + (active === t.key ? " active" : "") + '" data-action="select-editor-filter-tab" data-id="' + t.key + '">' +
              escapeHtml(t.label) + (count > 0 ? ' <span class="count">(' + count + ")</span>" : "") +
            "</button>"
          );
        }).join("") +
      "</div>" +
      editorFilterTabPanelHtml(active)
    );
  }

  function editorFilterTabPanelHtml(active) {
    if (active === "search") {
      return '<input type="search" id="editorSearch" class="filter-search-input" placeholder="Hae kirjastosta…" value="' + escapeHtml(state.editorSearch) + '">';
    }
    if (active === "time") {
      return timeFilterPanelHtml("editor", state.editorTimeFilter);
    }
    if (active === "procurementTarget") {
      return procurementTargetFilterPanelHtml("procurementTarget", state.editorProcurementTargetFilter, "toggle-editor-filter-btn", "clear-editor-filter");
    }
    var names = active === "category" ? managedCategoryNames() : active === "subcategory" ? managedSubcategoryNames() : managedIndustryNames();
    var selected = active === "category" ? state.editorCategoryFilter : active === "subcategory" ? state.editorSubcategoryFilter : state.editorIndustryFilter;
    return filterButtonsHtml(active, names, selected, "toggle-editor-filter-btn", "clear-editor-filter");
  }

  function rerenderEditorSearchSectionBody() {
    var el = document.getElementById("editorSearchSectionBody");
    if (el) el.innerHTML = editorSearchSectionBodyHtml();
  }

  // Suodattimen arvot on/off-painikkeina. toggleAction/clearAction
  // määräävät näkymäkohtaiset data-action-nimet.
  function filterButtonsHtml(dim, names, selected, toggleAction, clearAction) {
    if (names.length === 0) {
      return '<p class="empty-state" style="margin:0">Ei vaihtoehtoja.</p>';
    }
    return (
      '<div class="filter-buttons">' +
        names.map(function (n) {
          var isActive = selected.indexOf(n) !== -1;
          return (
            '<button type="button" class="filter-toggle-btn' + (isActive ? " active" : "") + '" data-action="' + toggleAction + '" data-dim="' + dim + '" data-value="' + escapeHtml(n) + '">' +
              escapeHtml(n) +
            "</button>"
          );
        }).join("") +
      "</div>" +
      (selected.length > 0
        ? '<button type="button" class="btn small ghost" data-action="' + clearAction + '" data-dim="' + dim + '" style="margin-top:10px">Tyhjennä</button>'
        : "")
    );
  }

  // Osuma, jos vaatimuksen procurementTargets sisältää jonkin valituista.
  function matchesProcurementTargetFilter(r, selected) {
    if (!selected.length) return true;
    var targets = r.procurementTargets || [];
    return selected.some(function (s) { return targets.indexOf(s) !== -1; });
  }

  // "Hankinnan kohde" -suodatinpaneeli, painikkeet ryhmiteltynä Omistajan
  // mukaan. Valinta on yksi tasainen taulukko (state[stateKey]), joten
  // käsittelijät ovat samat kuin filterButtonsHtml():llä.
  function procurementTargetFilterPanelHtml(dim, selected, toggleAction, clearAction) {
    var industriesWithTargets = state.industries.slice().sort(function (a, b) { return sortFi(a.name, b.name); }).filter(function (ind) {
      return procurementTargetsForIndustry(ind.name).length > 0;
    });
    if (industriesWithTargets.length === 0) {
      return '<p class="empty-state" style="margin:0">Ei vaihtoehtoja.</p>';
    }
    var groupsHtml = industriesWithTargets.map(function (ind) {
      var names = procurementTargetsForIndustry(ind.name).map(function (t) { return t.name; });
      return (
        '<div class="owner-subgroup">' +
          "<h4>" + escapeHtml(ind.name) + "</h4>" +
          '<div class="filter-buttons">' +
            names.map(function (n) {
              var isActive = selected.indexOf(n) !== -1;
              return '<button type="button" class="filter-toggle-btn' + (isActive ? " active" : "") + '" data-action="' + toggleAction + '" data-dim="' + dim + '" data-value="' + escapeHtml(n) + '">' + escapeHtml(n) + "</button>";
            }).join("") +
          "</div>" +
        "</div>"
      );
    }).join("");
    return groupsHtml + (selected.length > 0
      ? '<button type="button" class="btn small ghost" data-action="' + clearAction + '" data-dim="' + dim + '" style="margin-top:4px">Tyhjennä</button>'
      : "");
  }

  // "Ajan mukaan" -suodatin, yhteinen kaikille vaatimuksia suodattaville
  // korteille. Tila on olio {years, months, ranges, advancedOpen};
  // näkymäkohtainen tila ja uudelleenpiirto haetaan TIME_FILTER_SCOPES-
  // taulukosta.
  var TIME_FILTER_MONTHS = ["Tammi", "Helmi", "Maalis", "Huhti", "Touko", "Kesä", "Heinä", "Elo", "Syys", "Loka", "Marras", "Joulu"];
  var TIME_FILTER_RANGES = [
    { key: "7", label: "7 päivän sisällä", days: 7 },
    { key: "30", label: "30 päivän sisällä", days: 30 },
    { key: "180", label: "180 päivän sisällä", days: 180 },
    { key: "365", label: "365 päivän sisällä", days: 365 }
  ];

  function timeFilterActive(sel) {
    return !!(sel && (sel.years.length || sel.months.length || sel.ranges.length));
  }

  function requirementDates(r) {
    var dates = [];
    if (r.createdAt) dates.push(new Date(r.createdAt));
    if (r.updatedAt) dates.push(new Date(r.updatedAt));
    return dates;
  }

  function daysSince(date) {
    return Math.round((Date.now() - date.getTime()) / 86400000);
  }

  // Osuma, jos vaatimuksen luonti- tai muokkausaika täsmää. Ryhmien
  // (vuosi/kuukausi/aikaväli) välillä AND, ryhmän sisällä OR.
  function matchesTimeFilter(r, sel) {
    if (!timeFilterActive(sel)) return true;
    var dates = requirementDates(r);
    if (dates.length === 0) return false;
    var yearOk = sel.years.length === 0 || dates.some(function (d) { return sel.years.indexOf(d.getFullYear()) !== -1; });
    var monthOk = sel.months.length === 0 || dates.some(function (d) { return sel.months.indexOf(d.getMonth()) !== -1; });
    var rangeOk = sel.ranges.length === 0 || sel.ranges.some(function (key) {
      var range = TIME_FILTER_RANGES.filter(function (x) { return x.key === key; })[0];
      return dates.some(function (d) { return daysSince(d) <= range.days; });
    });
    return yearOk && monthOk && rangeOk;
  }

  // Vuodet lasketaan koko vaatimuskirjastosta, ei suodatetusta joukosta.
  function distinctRequirementYears() {
    var years = {};
    state.requirements.forEach(function (r) {
      requirementDates(r).forEach(function (d) { years[d.getFullYear()] = true; });
    });
    return Object.keys(years).map(Number).sort(function (a, b) { return b - a; });
  }

  function timeFilterCount(sel) {
    return sel ? sel.years.length + sel.months.length + sel.ranges.length : 0;
  }

  // "Ajan mukaan" -paneeli: pikavalinnat korvaavat koko valinnan,
  // "Näytä tarkemmat valinnat" avaa vuosi-/kuukausi-/aikaväliryhmät.
  // scope viittaa TIME_FILTER_SCOPES-avaimeen.
  function timeFilterPanelHtml(scope, sel) {
    var now = new Date();
    var quickChips = [
      { key: "range-7", label: "Viimeisin 7 vrk" },
      { key: "range-30", label: "Viimeisin 30 vrk" },
      { key: "year-" + now.getFullYear(), label: "Tänä vuonna" },
      { key: "month-" + now.getMonth(), label: "Tässä kuussa" }
    ];
    var advOpen = !!sel.advancedOpen;
    var years = distinctRequirementYears();
    return (
      '<div class="time-quick-row">' +
        quickChips.map(function (q) {
          return '<button type="button" class="time-quick-chip" data-action="select-time-quick" data-scope="' + scope + '" data-quick="' + q.key + '">' + escapeHtml(q.label) + "</button>";
        }).join("") +
      "</div>" +
      '<button type="button" class="time-disclosure-btn" data-action="toggle-time-advanced" data-scope="' + scope + '">' + (advOpen ? "▾ Piilota tarkemmat valinnat" : "▸ Näytä tarkemmat valinnat") + "</button>" +
      (advOpen ?
        '<div class="time-advanced-box">' +
          '<div class="time-group"><h4>Vuosi</h4>' +
            (years.length === 0
              ? '<p class="empty-state" style="margin:0">Ei vaihtoehtoja.</p>'
              : '<div class="filter-buttons">' + years.map(function (y) {
                  var active = sel.years.indexOf(y) !== -1;
                  return '<button type="button" class="filter-toggle-btn' + (active ? " active" : "") + '" data-action="toggle-time-year" data-scope="' + scope + '" data-value="' + y + '">' + y + "</button>";
                }).join("") + "</div>") +
          "</div>" +
          '<div class="time-group"><h4>Kuukausi</h4><div class="filter-buttons">' +
            TIME_FILTER_MONTHS.map(function (name, idx) {
              var active = sel.months.indexOf(idx) !== -1;
              return '<button type="button" class="filter-toggle-btn' + (active ? " active" : "") + '" data-action="toggle-time-month" data-scope="' + scope + '" data-value="' + idx + '">' + escapeHtml(name) + "</button>";
            }).join("") +
          "</div></div>" +
          '<div class="time-group"><h4>Viimeisen ajan sisällä</h4><div class="filter-buttons">' +
            TIME_FILTER_RANGES.map(function (r) {
              var active = sel.ranges.indexOf(r.key) !== -1;
              return '<button type="button" class="filter-toggle-btn' + (active ? " active" : "") + '" data-action="toggle-time-range" data-scope="' + scope + '" data-value="' + r.key + '">' + escapeHtml(r.label) + "</button>";
            }).join("") +
          "</div></div>" +
          (timeFilterActive(sel)
            ? '<button type="button" class="btn small ghost" data-action="clear-time-filter" data-scope="' + scope + '" style="margin-top:6px">Tyhjennä</button>'
            : "") +
        "</div>"
      : "")
    );
  }

  // Editorin suodatettu vaatimusjoukko (ks. editorAvailablePool).
  function editorPickerPool() {
    var q = state.editorSearch.trim().toLowerCase();
    var catFilter = state.editorCategoryFilter;
    var subFilter = state.editorSubcategoryFilter;
    var indFilter = state.editorIndustryFilter;
    return state.requirements.filter(function (r) {
      if (catFilter.length && catFilter.indexOf(r.category) === -1) return false;
      if (subFilter.length && subFilter.indexOf(r.subcategory || "") === -1) return false;
      if (indFilter.length && indFilter.indexOf(r.industry) === -1) return false;
      if (!matchesProcurementTargetFilter(r, state.editorProcurementTargetFilter)) return false;
      if (!matchesTimeFilter(r, state.editorTimeFilter)) return false;
      return !q || (r.text || "").toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q);
    });
  }

  // Valittavat: suodatetut vaatimukset, joita ei ole vielä dokumentilla,
  // kategorian ja tekstin mukaan järjestettynä.
  function editorAvailablePool(list) {
    var itemIds = (list && list.itemIds) || [];
    return editorPickerPool().filter(function (r) {
      return itemIds.indexOf(r.id) === -1;
    }).sort(function (a, b) {
      var c = sortFi(a.category, b.category);
      return c !== 0 ? c : sortFi(a.text, b.text);
    });
  }

  // Valittavat-kortti: "+ Lisää dokumentille" -painike.
  function pickerCardHtml(r) {
    var type = reqType(r);
    var chips = [];
    if (r.category) chips.push(hueChipHtml(r.category));
    if (r.subcategory) chips.push(hueChipHtml(r.subcategory));
    if (r.industry) chips.push('<span class="req-chip req-chip-owner">' + escapeHtml(r.industry) + "</span>");
    var chipsHtml = chips.length > 0 ? '<div class="req-card-chips">' + chips.join("") + "</div>" : "";
    return (
      '<li class="req-card ' + type + '" data-id="' + r.id + '">' +
        '<div class="req-card-top">' +
          '<span class="req-type-label ' + type + '">' + reqTypeLabel(type) + "</span>" +
          '<button type="button" class="add-to-list-btn" data-action="add-to-list" data-id="' + r.id + '">+ Lisää dokumentille</button>' +
        "</div>" +
        procurementTargetPillRowHtml(r.procurementTargets) +
        '<p class="req-card-text">' + escapeHtml(r.text) + "</p>" +
        reqExtraLineHtml("Tarkennus/perustelu", r.note) +
        reqExtraLineHtml("Hyväksyntäehto", r.acceptanceCondition) +
        chipsHtml +
      "</li>"
    );
  }

  function editorAvailableListHtml(list) {
    var pool = editorAvailablePool(list);
    if (pool.length === 0) {
      if (editorPickerPool().length === 0) {
        return '<div class="empty-state">' + (state.requirements.length === 0 ? "Kirjastossa ei ole vaatimuksia. Lisää niitä Osallistu-välilehdellä." : "Hakuehtoihin ei löytynyt vaatimuksia.") + "</div>";
      }
      return '<div class="empty-state">Kaikki hakuehtoihin sopivat vaatimukset on jo valittu tälle dokumentille.</div>';
    }
    return '<ol class="req-cards">' + pool.map(pickerCardHtml).join("") + "</ol>";
  }

  // Dokumenttikohtainen tarkennus/perustelu- tai hyväksyntäehtoarvo: jos
  // kartassa on avain (myös tyhjä merkkijono), se voittaa; muuten käytetään
  // vaatimuksen omaa arvoa.
  function listItemFieldValue(list, r, mapField, reqField) {
    var map = list[mapField] || {};
    return Object.prototype.hasOwnProperty.call(map, r.id) ? map[r.id] : (r[reqField] || "");
  }

  function listItemNoteValue(list, r) {
    return listItemFieldValue(list, r, "itemNotes", "note");
  }

  function listItemAcceptanceValue(list, r) {
    return listItemFieldValue(list, r, "itemAcceptanceConditions", "acceptanceCondition");
  }

  // Valitut-välilehti: numeroidut kortit, ↑/↓-järjestys, poisto ja
  // dokumenttikohtaiset tarkennus/perustelu- ja hyväksyntäehtokentät.
  function selectionCardHtml(r, list, i, total) {
    var id = r.id;
    var type = reqType(r);
    var noteValue = listItemNoteValue(list, r);
    var acceptanceValue = listItemAcceptanceValue(list, r);
    var chips = [];
    if (r.category) chips.push(hueChipHtml(r.category));
    if (r.subcategory) chips.push(hueChipHtml(r.subcategory));
    if (r.industry) chips.push('<span class="req-chip req-chip-owner">' + escapeHtml(r.industry) + "</span>");
    var chipsHtml = chips.length > 0 ? '<div class="req-card-chips">' + chips.join("") + "</div>" : "";
    return (
      '<li class="req-card ' + type + '" data-id="' + id + '">' +
        '<div class="req-card-top">' +
          '<span class="req-card-top-left"><span class="sel-num">' + (i + 1) + '</span><span class="req-type-label ' + type + '">' + reqTypeLabel(type) + "</span></span>" +
          '<div class="sel-actions">' +
            '<button type="button" data-action="move-up" data-id="' + id + '" title="Siirrä ylös"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
            '<button type="button" data-action="move-down" data-id="' + id + '" title="Siirrä alas"' + (i === total - 1 ? " disabled" : "") + ">↓</button>" +
            '<button type="button" class="remove-from-list-btn" data-action="remove-pick" data-id="' + id + '">✕ Poista dokumentilta</button>' +
          "</div>" +
        "</div>" +
        procurementTargetPillRowHtml(r.procurementTargets) +
        '<p class="req-card-text">' + escapeHtml(r.text) + "</p>" +
        chipsHtml +
        '<textarea class="sel-note-input" data-id="' + id + '" rows="1" placeholder="Tarkennus/perustelu tälle dokumentille (valinnainen)">' + escapeHtml(noteValue) + "</textarea>" +
        '<textarea class="sel-note-input" data-field="acceptance" data-id="' + id + '" rows="1" placeholder="Hyväksyntäehto tälle dokumentille (valinnainen)">' + escapeHtml(acceptanceValue) + "</textarea>" +
      "</li>"
    );
  }

  function selectionListHtml(list) {
    var itemIds = list.itemIds || [];
    if (itemIds.length === 0) {
      return '<div class="empty-state">Ei valittuja vaatimuksia. Lisää niitä Valittavat-välilehdeltä.</div>';
    }
    var rows = itemIds.map(function (id, i) {
      var r = state.requirements.find(function (x) { return x.id === id; });
      return r ? selectionCardHtml(r, list, i, itemIds.length) : "";
    }).join("");
    return '<ol class="req-cards">' + rows + "</ol>";
  }

  // Lisää vaatimuksen dokumentille ja kopioi sen tarkennus/perustelu- ja
  // hyväksyntäehtoarvot dokumenttikohtaisiksi lähtöarvoiksi.
  function addRequirementToList(id) {
    var list = currentList();
    if (!list) return;
    var itemIds = (list.itemIds || []).slice();
    if (itemIds.indexOf(id) !== -1) return;
    var itemNotes = Object.assign({}, list.itemNotes || {});
    var itemAcceptanceConditions = Object.assign({}, list.itemAcceptanceConditions || {});
    itemIds.push(id);
    var pickedReq = state.requirements.find(function (x) { return x.id === id; });
    itemNotes[id] = (pickedReq && pickedReq.note) || "";
    itemAcceptanceConditions[id] = (pickedReq && pickedReq.acceptanceCondition) || "";
    list.itemIds = itemIds; // optimistinen paivitys nopeaan UI-vasteeseen
    list.itemNotes = itemNotes;
    list.itemAcceptanceConditions = itemAcceptanceConditions;
    rerenderEditorPanes();
    updateList(list.id, { itemIds: itemIds, itemNotes: itemNotes, itemAcceptanceConditions: itemAcceptanceConditions }).then(rerenderEditorPanes);
  }

  function rerenderEditorPanes() {
    var list = currentList();
    if (!list) { render(); return; }
    rerenderEditorTabArea();
    var printBtn = document.querySelector('.editor-head [data-action="print-list"]');
    if (printBtn) printBtn.disabled = (list.itemIds || []).length === 0;
  }

  // ---------- Näkymä: Tulostus ----------
  // Tyyppiosioiden järjestys tulosteessa (eri kuin REQ_TYPES:n järjestys).
  var PRINT_TYPE_ORDER = ["mandatory", "scored", "optional"];

  // Dokumentin tuloste: perustietolaatikko ja vaatimuskortit ryhmiteltynä
  // tyypin ja kategorian mukaan. Numerointi alkaa yhdestä per dokumentti.
  function printDocHtml(list) {
    var itemIds = list.itemIds || [];
    var items = itemIds.map(function (id) { return state.requirements.find(function (r) { return r.id === id; }); }).filter(Boolean);

    var n = 0;
    function printNoteLineHtml(label, value) {
      return value ? '<p class="print-note"><strong>' + escapeHtml(label) + ":</strong> " + escapeHtml(value) + "</p>" : "";
    }

    // Kortti: kolme lohkoa — numero, alakategoria ja teksti; tarkennus/
    // perustelu ja hyväksyntäehto (jos asetettu); hankinnan kohteet (jos on).
    function printCardHtml(r) {
      n++;
      var note = listItemNoteValue(list, r);
      var acceptance = listItemAcceptanceValue(list, r);
      var notesHtml = printNoteLineHtml("Tarkennus/perustelu", note) + printNoteLineHtml("Hyväksyntäehto", acceptance);
      var targets = r.procurementTargets || [];
      return (
        '<div class="print-card">' +
          '<div class="print-card-block print-card-top">' +
            '<span class="print-numbox">' + n + "</span>" +
            '<div>' +
              (r.subcategory ? '<span class="print-subcat-tag">' + escapeHtml(r.subcategory) + "</span><br>" : "") +
              "<p>" + escapeHtml(r.text) + "</p>" +
            "</div>" +
          "</div>" +
          (notesHtml ? '<div class="print-card-block print-card-notes">' + notesHtml + "</div>" : "") +
          (targets.length > 0
            ? '<div class="print-card-block print-card-targets"><span class="print-block-label">Hankinnan kohde</span>' +
                targets.map(function (t) { return '<span class="print-target-pill">' + escapeHtml(t) + "</span>"; }).join("") +
              "</div>"
            : "") +
        "</div>"
      );
    }

    var byType = { mandatory: [], scored: [], optional: [] };
    items.forEach(function (r) { byType[reqType(r)].push(r); });

    var typeSectionsHtml = PRINT_TYPE_ORDER.map(function (type) {
      var typeItems = byType[type];
      if (typeItems.length === 0) return "";
      var order = [];
      var groups = {};
      typeItems.forEach(function (r) {
        if (!groups[r.category]) { groups[r.category] = []; order.push(r.category); }
        groups[r.category].push(r);
      });
      var catsHtml = order.map(function (cat) {
        return (
          '<div class="print-cat-group">' +
            "<h3>" + escapeHtml(cat) + "</h3>" +
            groups[cat].map(printCardHtml).join("") +
          "</div>"
        );
      }).join("");
      return (
        '<section class="print-type-section ' + type + '">' +
          '<div class="print-type-head"><h2>' + reqTypeLabel(type) + '</h2><span class="print-type-count">(' + typeItems.length + ")</span></div>" +
          catsHtml +
        "</section>"
      );
    }).join("");

    return (
      '<article class="print-doc">' +
        '<header class="print-header-block">' +
          "<h1>" + escapeHtml(list.name || "Nimetön dokumentti") + "</h1>" +
          '<dl class="print-info-box">' +
            (listProcurementTargets(list).length > 0
              ? "<dt>Hankinnan kohteet</dt><dd>" + listProcurementTargets(list).map(function (t) { return '<span class="print-target-pill">' + escapeHtml(t) + "</span>"; }).join("") + "</dd>"
              : "") +
            (list.notes ? "<dt>Kuvaus</dt><dd>" + escapeHtml(list.notes) + "</dd>" : "") +
            (function () {
              var contact = [list.contactName, list.contactPhone, list.contactEmail].filter(Boolean).map(escapeHtml).join(" · ");
              return contact ? "<dt>Yhteyshenkilö</dt><dd>" + contact + "</dd>" : "";
            })() +
            (function () {
              var company = list.companyId ? state.companies.find(function (c) { return c.id === list.companyId; }) : null;
              if (!company) return "";
              var line1 = [company.name, company.businessId ? "y-tunnus " + company.businessId : ""].filter(Boolean).map(escapeHtml).join(" · ");
              var addressLine = [company.postalAddress, [company.postalCode, company.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
              var line2 = [addressLine, company.phone, company.email].filter(Boolean).map(escapeHtml).join(" · ");
              return "<dt>Laatija</dt><dd>" + line1 + (line2 ? "<br>" + line2 : "") + "</dd>";
            })() +
            "<dt>Vaatimuksia</dt><dd>" + items.length + " kpl</dd>" +
            "<dt>Tulostettu</dt><dd>" + fmtDate(new Date().toISOString()) + "</dd>" +
          "</dl>" +
        "</header>" +
        (items.length === 0 ? '<p style="color:var(--muted)">Dokumentilla ei ole vaatimuksia.</p>' : typeSectionsHtml) +
      "</article>"
    );
  }

  function tplPrint() {
    var ids = (state.printListIds && state.printListIds.length) ? state.printListIds : (state.currentListId ? [state.currentListId] : []);
    var lists = ids.map(function (id) { return state.lists.find(function (l) { return l.id === id; }); }).filter(Boolean);
    if (lists.length === 0) return '<div class="empty-state">Dokumenttia ei löytynyt.</div>';
    // Useampi dokumentti tulostetaan nimen mukaisessa aakkosjärjestyksessä.
    lists.sort(function (a, b) { return sortFi(a.name || "", b.name || ""); });

    // Oma div, jotta .print-toolbar:lla on aina kaksi lasta
    // (space-between).
    var backHtml = lists.length === 1
      ? '<button type="button" class="btn" data-action="back-to-editor" data-id="' + lists[0].id + '">← Muokkaa dokumenttia</button>' +
        '<button type="button" class="btn" data-action="back-to-lists">← Kaikki dokumentit</button>'
      : '<button type="button" class="btn" data-action="back-to-lists">← Takaisin dokumentteihin</button>';

    return (
      '<div class="print-toolbar no-print">' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' + backHtml + "</div>" +
        '<button type="button" class="btn primary" data-action="do-print">Tulosta / tallenna PDF</button>' +
      "</div>" +
      lists.map(function (list) { return printDocHtml(list); }).join("")
    );
  }

  // Vientiin valittavien vaatimusten joukko, omat suodatintilat
  // (state.collab*).
  function collabPool() {
    var q = state.collabSearch.trim().toLowerCase();
    var catFilter = state.collabCategoryFilter;
    var subFilter = state.collabSubcategoryFilter;
    var indFilter = state.collabIndustryFilter;
    return state.requirements.filter(function (r) {
      if (catFilter.length && catFilter.indexOf(r.category) === -1) return false;
      if (subFilter.length && subFilter.indexOf(r.subcategory || "") === -1) return false;
      if (indFilter.length && indFilter.indexOf(r.industry) === -1) return false;
      if (!matchesProcurementTargetFilter(r, state.collabProcurementTargetFilter)) return false;
      if (!matchesTimeFilter(r, state.collabTimeFilter)) return false;
      return !q || (r.text || "").toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q);
    });
  }

  function collabFiltersActive() {
    return !!(state.collabSearch.trim() || state.collabCategoryFilter.length || state.collabSubcategoryFilter.length || state.collabIndustryFilter.length || state.collabProcurementTargetFilter.length || timeFilterActive(state.collabTimeFilter));
  }

    if (key === "procurementTarget") return state.collabProcurementTargetFilter.length;
    if (key === "time") return timeFilterCount(state.collabTimeFilter);
    return 0;
  }

  // Lataa JSON-tiedoston selaimessa (Blob + ObjectURL).
  function downloadJsonFile(filename, dataObj) {
    var blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

    var items = state.requirements
      .filter(function (r) { return state.collabSelectedIds.indexOf(r.id) !== -1; })
      .map(function (r) {
        return { text: r.text, category: r.category, subcategory: r.subcategory || "", industry: r.industry, type: reqType(r), note: r.note || "", acceptanceCondition: r.acceptanceCondition || "" };
      });
    if (items.length === 0) return;
    downloadJsonFile("vaatimukset-vienti-" + new Date().toISOString().slice(0, 10) + ".json", { items: items });
  }

  // ---------- Tapahtumat ----------
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "addForm") {
      e.preventDefault();
      var fd = new FormData(e.target);
      var text = (fd.get("text") || "").toString().trim();
      var category = (fd.get("category") || "").toString().trim();
      var industry = (fd.get("industry") || "").toString().trim();
      var subcategory = (fd.get("subcategory") || "").toString().trim();
      if (!text || !category || !industry) return;
      var type = (fd.get("type") || "mandatory").toString();
      var note = (fd.get("note") || "").toString().trim();
      var acceptanceCondition = (fd.get("acceptanceCondition") || "").toString().trim();
      var procurementTargetsCsv = (fd.get("procurementTargets") || "").toString();
      var procurementTargets = procurementTargetsCsv ? procurementTargetsCsv.split(",") : [];
      var payload = { text: text, category: category, subcategory: subcategory, industry: industry, mandatory: type === "mandatory", type: type, note: note, acceptanceCondition: acceptanceCondition, procurementTargets: procurementTargets };
      if (state.addWizardMode === "edit" && state.addWizardEditingId) {
        updateRequirement(state.addWizardEditingId, payload);
      } else {
        addRequirement(payload);
      }
      resetAddWizardAfterSave();
    } else if (e.target && e.target.id === "addCategoryForm") {
      e.preventDefault();
      var fd2 = new FormData(e.target);
      var name = (fd2.get("name") || "").toString().trim();
      if (!name) return;
      if (categoryNameExists(name)) {
        showCategoryMessage('Kategoria “' + name + '” on jo olemassa.');
        return;
      }
      clearCategoryMessage();
      addCategory(name);
      e.target.reset();
    } else if (e.target && e.target.id === "addSubcategoryForm") {
      e.preventDefault();
      var fd3 = new FormData(e.target);
      var subName = (fd3.get("name") || "").toString().trim();
      if (!subName) return;
      if (subcategoryNameExists(subName)) {
        showSubcategoryMessage('Alakategoria “' + subName + '” on jo olemassa.');
        return;

    } else if (action === "cancel-edit-category") {
      state.editingCategoryId = null;
      clearCategoryMessage();
      rerenderCategoriesList();
    } else if (action === "save-category") {
      var input = document.querySelector('.cat-edit-input[data-id="' + id + '"]');
      var newName = input ? input.value.trim() : "";
      var cat = state.categories.find(function (x) { return x.id === id; });
      if (!cat || !newName) return;
      if (newName !== cat.name && categoryNameExists(newName, id)) {
        showCategoryMessage('Kategoria “' + newName + '” on jo olemassa.');
        return;
      }
      var oldName = cat.name;
      renameCategory(id, oldName, newName).then(function () {
        state.editingCategoryId = null;
        clearCategoryMessage();
        rerenderCategoriesList();
      });
    } else if (action === "delete-category") {
      var catToDelete = state.categories.find(function (x) { return x.id === id; });
      if (!catToDelete) return;
      var count = usageCount(catToDelete.name);
      if (count > 0) {
        showAlert('Kategoriaa “' + catToDelete.name + '” käytetään ' + count + (count === 1 ? " vaatimuksessa" : " vaatimuksessa") + '. Muuta ensin näiden vaatimusten kategoria toiseksi Kirjasto-välilehdellä.');
        return;
      }
      clearCategoryMessage();
      showConfirm("Poistetaanko kategoria “" + catToDelete.name + "” pysyvästi?", function () {
        deleteCategory(id).then(rerenderCategoriesList);
      });
    } else if (action === "edit-subcategory") {
      state.editingSubcategoryId = id;
      clearSubcategoryMessage();
      rerenderSubcategoriesList();
    } else if (action === "cancel-edit-subcategory") {
      state.editingSubcategoryId = null;
      clearSubcategoryMessage();
      rerenderSubcategoriesList();
    } else if (action === "save-subcategory") {
      var subInput = document.querySelector('.subcat-edit-input[data-id="' + id + '"]');
      var newSubName = subInput ? subInput.value.trim() : "";
      var subcat = state.subcategories.find(function (x) { return x.id === id; });
      if (!subcat || !newSubName) return;
      if (newSubName !== subcat.name && subcategoryNameExists(newSubName, id)) {
        showSubcategoryMessage('Alakategoria “' + newSubName + '” on jo olemassa.');
        return;
      }
      var oldSubName = subcat.name;
      renameSubcategory(id, oldSubName, newSubName).then(function () {
        state.editingSubcategoryId = null;
        clearSubcategoryMessage();
        rerenderSubcategoriesList();
      });
    } else if (action === "delete-subcategory") {
      var subToDelete = state.subcategories.find(function (x) { return x.id === id; });
      if (!subToDelete) return;
      var subCount = subcategoryUsageCount(subToDelete.name);
      if (subCount > 0) {
        showAlert('Alakategoriaa “' + subToDelete.name + '” käytetään ' + subCount + (subCount === 1 ? " vaatimuksessa" : " vaatimuksessa") + '. Muuta ensin näiden vaatimusten alakategoria toiseksi Kirjasto-välilehdellä.');
        return;
      }
      clearSubcategoryMessage();
      showConfirm("Poistetaanko alakategoria “" + subToDelete.name + "” pysyvästi?", function () {
        deleteSubcategory(id).then(rerenderSubcategoriesList);
      });
    } else if (action === "edit-industry") {
      state.editingIndustryId = id;
      clearIndustryMessage();
      rerenderIndustriesList();
    } else if (action === "cancel-edit-industry") {
      state.editingIndustryId = null;
      clearIndustryMessage();
      rerenderIndustriesList();
    } else if (action === "save-industry") {
      var indNameInput = document.querySelector('.ind-edit-name[data-id="' + id + '"]');
      var indTitleInput = document.querySelector('.ind-edit-title[data-id="' + id + '"]');
      var newIndName = indNameInput ? indNameInput.value.trim() : "";
      var newIndTitle = indTitleInput ? indTitleInput.value.trim() : "";
      var ind = state.industries.find(function (x) { return x.id === id; });
      if (!ind || !newIndName || !newIndTitle) return;
      if (newIndName !== ind.name && industryNameExists(newIndName, id)) {
        showIndustryMessage('Omistaja “' + newIndName + '” on jo olemassa.');
        return;
      }
      var oldIndName = ind.name;
      renameIndustry(id, oldIndName, newIndName, newIndTitle).then(function () {
        state.editingIndustryId = null;
        clearIndustryMessage();
        rerenderIndustriesList();
      });
    } else if (action === "delete-industry") {
      var indToDelete = state.industries.find(function (x) { return x.id === id; });
      if (!indToDelete) return;
      var indCount = industryUsageCount(indToDelete.name);
      if (indCount > 0) {
        showAlert('Omistajaa “' + indToDelete.name + '” käytetään ' + indCount + (indCount === 1 ? " vaatimuksessa" : " vaatimuksessa") + '. Muuta ensin näiden vaatimusten omistaja toiseksi Kirjasto-välilehdellä.');
        return;
      }
      var indTargetCount = procurementTargetsForIndustry(indToDelete.name).length;
      if (indTargetCount > 0) {
        showAlert('Omistajalla “' + indToDelete.name + '” on ' + indTargetCount + (indTargetCount === 1 ? " hankinnan kohde" : " hankinnan kohdetta") + '. Poista tai siirrä ne ensin Hankinnan kohteet -välilehdellä.');
        return;
      }
      clearIndustryMessage();
      showConfirm("Poistetaanko omistaja “" + indToDelete.name + "” pysyvästi?", function () {
        deleteIndustry(id).then(rerenderIndustriesList);
      });
    } else if (action === "edit-procurement-target") {
      state.editingProcurementTargetId = id;
      clearProcurementTargetMessage();
      rerenderProcurementTargetGroups();
    } else if (action === "cancel-edit-procurement-target") {
      state.editingProcurementTargetId = null;
      clearProcurementTargetMessage();
      rerenderProcurementTargetGroups();
    } else if (action === "save-procurement-target") {
      var ptNameInput = document.querySelector('.pt-edit-name[data-id="' + id + '"]');
      var ptIndustrySelect = document.querySelector('.pt-edit-industry[data-id="' + id + '"]');
      var newPtName = ptNameInput ? ptNameInput.value.trim() : "";
      var newPtIndustry = ptIndustrySelect ? ptIndustrySelect.value : "";
      var pt = state.procurementTargets.find(function (x) { return x.id === id; });
      if (!pt || !newPtName || !newPtIndustry) return;
      if ((newPtName !== pt.name || newPtIndustry !== pt.industry) && procurementTargetNameExists(newPtName, newPtIndustry, id)) {
        showProcurementTargetMessage('Hankinnan kohde "' + newPtName + '" on jo olemassa omistajalla "' + newPtIndustry + '".');
        return;
      }
      var oldPtName = pt.name;
      renameProcurementTarget(id, oldPtName, newPtName, newPtIndustry).then(function () {
        state.editingProcurementTargetId = null;
        clearProcurementTargetMessage();
        rerenderProcurementTargetGroups();
      });
    } else if (action === "delete-procurement-target") {
      var ptToDelete = state.procurementTargets.find(function (x) { return x.id === id; });
      if (!ptToDelete) return;
      var ptCount = procurementTargetUsageCount(ptToDelete.name);
      if (ptCount > 0) {
        showAlert('Hankinnan kohdetta "' + ptToDelete.name + '" käytetään ' + ptCount + (ptCount === 1 ? " kohteessa" : " kohteessa") + ' (vaatimuksissa tai dokumenteilla). Poista ensin nämä viittaukset.');
        return;
      }
      clearProcurementTargetMessage();
      showConfirm('Poistetaanko hankinnan kohde "' + ptToDelete.name + '" pysyvästi?', function () {
        deleteProcurementTarget(id).then(rerenderProcurementTargetGroups);
      });
    } else if (action === "edit-company") {
      state.editingCompanyId = id;
      clearCompanyMessage();
      rerenderCompaniesList();
    } else if (action === "cancel-edit-company") {
      state.editingCompanyId = null;
      clearCompanyMessage();
      rerenderCompaniesList();
    } else if (action === "save-company") {
      var nameInput = document.querySelector('.comp-edit-name[data-id="' + id + '"]');
      var newCompName = nameInput ? nameInput.value.trim() : "";
      var comp = state.companies.find(function (x) { return x.id === id; });
      if (!comp || !newCompName) return;
      if (newCompName !== comp.name && companyNameExists(newCompName, id)) {
        showCompanyMessage('Yritys “' + newCompName + '” on jo olemassa.');
        return;
      }
      var bizInput = document.querySelector('.comp-edit-businessid[data-id="' + id + '"]');
      var addrInput = document.querySelector('.comp-edit-address[data-id="' + id + '"]');
      var postalCodeInput = document.querySelector('.comp-edit-postalcode[data-id="' + id + '"]');
      var cityInput = document.querySelector('.comp-edit-city[data-id="' + id + '"]');
      var phoneInput = document.querySelector('.comp-edit-phone[data-id="' + id + '"]');
      var emailInput = document.querySelector('.comp-edit-email[data-id="' + id + '"]');
      updateCompany(id, {
        name: newCompName,
        businessId: bizInput ? bizInput.value.trim() : "",
        postalAddress: addrInput ? addrInput.value.trim() : "",
        postalCode: postalCodeInput ? postalCodeInput.value.trim() : "",
        city: cityInput ? cityInput.value.trim() : "",
        phone: phoneInput ? phoneInput.value.trim() : "",
        email: emailInput ? emailInput.value.trim() : ""
      }).then(function () {
        state.editingCompanyId = null;
        clearCompanyMessage();
        rerenderCompaniesList();
      });
    } else if (action === "set-default-company") {
      setDefaultCompany(id).then(function () {
        rerenderCompaniesList();
      });
    } else if (action === "delete-company") {
      var compToDelete = state.companies.find(function (x) { return x.id === id; });
      if (!compToDelete) return;
      var compCount = companyUsageCount(compToDelete.id);
      if (compCount > 0) {
        showCompanyMessage('Yritystä “' + compToDelete.name + '” käytetään ' + compCount + (compCount === 1 ? " dokumentissa" : " dokumentissa") + '. Muuta ensin näiden dokumenttien yritys toiseksi Hyödynnä-välilehdellä.');
        return;
      }
      clearCompanyMessage();
      showConfirm("Poistetaanko yritys “" + compToDelete.name + "” pysyvästi?", function () {
        deleteCompany(id).then(rerenderCompaniesList);
      });
    } else if (action === "edit-phrase") {
      state.editingPhraseId = id;
      clearPhraseMessage();
      rerenderPhrasesList();
    } else if (action === "cancel-edit-phrase") {
      state.editingPhraseId = null;
      clearPhraseMessage();
      rerenderPhrasesList();
    } else if (action === "save-phrase") {
      var phraseTextarea = document.querySelector('.phrase-edit-text[data-id="' + id + '"]');
      var newPhraseText = phraseTextarea ? phraseTextarea.value.trim() : "";
      if (!newPhraseText) return;
      var phraseCategorySelect = document.querySelector('.phrase-edit-category[data-id="' + id + '"]');
      var phraseSubcategorySelect = document.querySelector('.phrase-edit-subcategory[data-id="' + id + '"]');
      var newPhraseCategory = phraseCategorySelect ? phraseCategorySelect.value : "";
      var newPhraseSubcategory = phraseSubcategorySelect ? phraseSubcategorySelect.value : "";
      updatePhrase(id, newPhraseText, newPhraseCategory, newPhraseSubcategory).then(function () {
        state.editingPhraseId = null;
        clearPhraseMessage();
        rerenderPhrasesList();
      });
    } else if (action === "delete-phrase") {
      var phraseToDelete = state.phrases.find(function (x) { return x.id === id; });
      if (!phraseToDelete) return;
      clearPhraseMessage();
      showConfirm("Poistetaanko fraasi pysyvästi?", function () {
        deletePhrase(id).then(rerenderPhrasesList);
      });
    } else if (action === "switch-api-key") {
      showConfirm("Vaihdetaanko API-avain? Nykyinen avain poistetaan tästä selaimesta.", function () {
        setApiKey("");
        state.dbReady = "auth";
        renderBanner();
        showApiKeyPrompt("Syötä uusi API-avain.");
        updateSwitchKeyButtonVisibility();
      }, "Vaihda avain");
    } else if (action === "seed-defaults") {
      showConfirm(
        "Alustetaanko järjestelmä oletustaustatiedoilla? Puuttuvat kategoriat, alakategoriat, omistajat ja fraasit lisätään data/seed.json-tiedostosta — jo olemassa olevia ei muuteta.",
        function () {
          apiFetch("/api/seed", { method: "POST" }).then(function (result) {
            state.seedResult = result;
            return refreshState();
          }).then(function () {
            render();
          });
        },
        "Alusta"
      );
    } else if (action === "close-seed-result") {
      state.seedResult = null;
      render();
    } else if (action === "toggle-collab-filters-section") {
      var recordedCollabSection = state.collabFiltersSectionOpen;
      var isOpenCollabSection = (recordedCollabSection === null || recordedCollabSection === undefined) ? true : recordedCollabSection;
      state.collabFiltersSectionOpen = !isOpenCollabSection;
      rerenderCollabFiltersSection();
    } else if (action === "select-collab-filter-tab") {
      state.collabFilterTab = id;
      rerenderCollabSearchSectionBody();
    } else if (action === "toggle-collab-filter-btn") {
      var collabDim = t.getAttribute("data-dim");
      var collabVal = t.getAttribute("data-value");
      var collabArrKey = collabDim === "category" ? "collabCategoryFilter" : collabDim === "subcategory" ? "collabSubcategoryFilter" : collabDim === "procurementTarget" ? "collabProcurementTargetFilter" : "collabIndustryFilter";
      var collabArr = state[collabArrKey].slice();
      var collabVIdx = collabArr.indexOf(collabVal);
      if (collabVIdx === -1) collabArr.push(collabVal); else collabArr.splice(collabVIdx, 1);
      state[collabArrKey] = collabArr;
      rerenderCollabSearchSectionBody();
      var collabPickerAfterFilter = document.getElementById("collabPickerList");
      if (collabPickerAfterFilter) collabPickerAfterFilter.innerHTML = collabPickerListHtml();
      var collabCountAfterFilter = document.getElementById("collabPickerCount");
      if (collabCountAfterFilter) collabCountAfterFilter.textContent = collabPool().length;
      updateCollabFiltersActiveBadge();
    } else if (action === "clear-collab-filter") {
      var collabClearDim = t.getAttribute("data-dim");
      var collabClearKey = collabClearDim === "category" ? "collabCategoryFilter" : collabClearDim === "subcategory" ? "collabSubcategoryFilter" : collabClearDim === "procurementTarget" ? "collabProcurementTargetFilter" : "collabIndustryFilter";
      state[collabClearKey] = [];
      rerenderCollabSearchSectionBody();
      var collabPickerAfterClear = document.getElementById("collabPickerList");
      if (collabPickerAfterClear) collabPickerAfterClear.innerHTML = collabPickerListHtml();
      var collabCountAfterClear = document.getElementById("collabPickerCount");
      if (collabCountAfterClear) collabCountAfterClear.textContent = collabPool().length;
      updateCollabFiltersActiveBadge();
    } else if (action === "toggle-collab-share") {
      var collabShareIdx = state.collabSelectedIds.indexOf(id);
      var nowSharing;
      if (collabShareIdx === -1) { state.collabSelectedIds.push(id); nowSharing = true; }
      else { state.collabSelectedIds.splice(collabShareIdx, 1); nowSharing = false; }
      t.textContent = nowSharing ? "Jaetaan" : "Ei jaeta";
      t.classList.toggle("sharing", nowSharing);
      rerenderCollabActionsBar();
    } else if (action === "export-collab-selected") {
      collabExportSelected();
    } else if (action === "confirm-collab-import") {
      var collabPreviewData = state.collabImportPreview;
      if (!collabPreviewData) return;
      apiFetch("/api/collaborate/import", { method: "POST", body: JSON.stringify({ items: collabPreviewData.items }) }).then(function (result) {
        state.collabImportResult = result;
        state.collabImportPreview = null;
        return refreshState();
      }).then(function () {
        var collabFileInput = document.getElementById("collabImportFile");
        if (collabFileInput) collabFileInput.value = "";
        rerenderCollabImportSection();
      });
    } else if (action === "cancel-collab-import") {
      state.collabImportPreview = null;
      state.collabImportError = null;
      var collabFileInputCancel = document.getElementById("collabImportFile");
      if (collabFileInputCancel) collabFileInputCancel.value = "";
      rerenderCollabImportSection();
    } else if (action === "close-collab-import-result") {
      state.collabImportResult = null;
      rerenderCollabImportSection();
    } else if (action === "new-list") {
      addList();
    } else if (action === "open-list") {
      state.currentListId = id;
      state.editorSearch = "";
      state.editorCategoryFilter = [];
      state.editorSubcategoryFilter = [];
      state.editorIndustryFilter = [];
      state.editorProcurementTargetFilter = [];
      state.editorSectionOpen = { search: null };
      state.editorTab = "available";
      state.editorFilterTab = "category";
      state.view = "editor";
      render();
    } else if (action === "back-to-lists") {
      state.currentListId = null;
      state.view = "lists";
      render();
    } else if (action === "back-to-editor") {
      state.currentListId = id;
      state.view = "editor";
      render();
    } else if (action === "print-list") {
      if (t.disabled) return;
      state.currentListId = id;
      state.printListIds = [id];
      state.view = "print";
      render();
    } else if (action === "print-selected-lists") {
      if (t.disabled || state.selectedListIds.length === 0) return;
      state.printListIds = state.selectedListIds.slice();
      state.view = "print";
      render();
    } else if (action === "do-print") {
      window.print();
    } else if (action === "delete-list") {
      showConfirm("Poistetaanko dokumentti pysyvästi?", function () {
        deleteList(id).then(function () {
          if (state.currentListId === id) state.currentListId = null;
          var selDelIdx = state.selectedListIds.indexOf(id);
          if (selDelIdx !== -1) state.selectedListIds.splice(selDelIdx, 1);
          state.view = "lists";
          render();
        });
      });
    } else if (action === "confirm-yes") {
      var fn = pendingConfirmAction;
      hideConfirm();
      if (fn) fn();
    } else if (action === "confirm-no") {
      hideConfirm();
    } else if (action === "alert-ok") {
      hideAlert();
    } else if (action === "move-up" || action === "move-down") {
      var list3 = currentList();
      if (!list3) return;
      var itemIds3 = (list3.itemIds || []).slice();
      var idx3 = itemIds3.indexOf(id);
      var swapWith = action === "move-up" ? idx3 - 1 : idx3 + 1;
      if (swapWith < 0 || swapWith >= itemIds3.length) return;
      var tmp = itemIds3[idx3];
      itemIds3[idx3] = itemIds3[swapWith];
      itemIds3[swapWith] = tmp;
      list3.itemIds = itemIds3;
      rerenderEditorPanes();
      updateList(list3.id, { itemIds: itemIds3 }).then(rerenderEditorPanes);
    } else if (action === "remove-pick") {
      var list4 = currentList();
      if (!list4) return;
      var itemIds4 = (list4.itemIds || []).filter(function (x) { return x !== id; });
      var itemNotes4 = Object.assign({}, list4.itemNotes || {});
      var itemAcceptanceConditions4 = Object.assign({}, list4.itemAcceptanceConditions || {});
      delete itemNotes4[id];
      delete itemAcceptanceConditions4[id];
      list4.itemIds = itemIds4;
      list4.itemNotes = itemNotes4;
      list4.itemAcceptanceConditions = itemAcceptanceConditions4;
      rerenderEditorPanes();
      updateList(list4.id, { itemIds: itemIds4, itemNotes: itemNotes4, itemAcceptanceConditions: itemAcceptanceConditions4 }).then(rerenderEditorPanes);
    } else if (action === "pick-list-procurement-target") {
      var listPtPick = currentList();
      if (!listPtPick) return;
      var pickVal = t.getAttribute("data-value");
      var pickArr = listProcurementTargets(listPtPick).slice();
      if (pickArr.indexOf(pickVal) === -1) pickArr.push(pickVal);
      listPtPick.procurementTargets = pickArr;
      var chipsEl = document.getElementById("listProcurementTargetChips");
      if (chipsEl) chipsEl.innerHTML = procurementTargetChipsHtml(pickArr);
      var searchInput = document.getElementById("listProcurementTargetSearch");
      if (searchInput) searchInput.value = "";
      var dropdownEl = document.getElementById("listProcurementTargetDropdown");
      if (dropdownEl) { dropdownEl.hidden = true; dropdownEl.innerHTML = ""; }
      updateList(listPtPick.id, { procurementTargets: pickArr });
    } else if (action === "remove-list-procurement-target") {
      var listPtRemove = currentList();
      if (!listPtRemove) return;
      var removeVal = t.getAttribute("data-value");
      var removeArr = listProcurementTargets(listPtRemove).filter(function (n) { return n !== removeVal; });
      listPtRemove.procurementTargets = removeArr;
      var chipsElR = document.getElementById("listProcurementTargetChips");
      if (chipsElR) chipsElR.innerHTML = procurementTargetChipsHtml(removeArr);
      updateList(listPtRemove.id, { procurementTargets: removeArr });
    } else if (action === "select-editor-filter-tab") {
      state.editorFilterTab = id;
      rerenderEditorSearchSectionBody();
    } else if (action === "toggle-editor-filter-btn") {
      var dim = t.getAttribute("data-dim");
      var val = t.getAttribute("data-value");
      var arrKey = dim === "category" ? "editorCategoryFilter" : dim === "subcategory" ? "editorSubcategoryFilter" : dim === "procurementTarget" ? "editorProcurementTargetFilter" : "editorIndustryFilter";
      var arr = state[arrKey].slice();
      var vIdx = arr.indexOf(val);
      if (vIdx === -1) arr.push(val); else arr.splice(vIdx, 1);
      state[arrKey] = arr;
      rerenderEditorSearchSectionBody();
      rerenderEditorTabArea();
      updateEditorFiltersActiveBadge();
    } else if (action === "clear-editor-filter") {
      var clearDim = t.getAttribute("data-dim");
      var clearKey = clearDim === "category" ? "editorCategoryFilter" : clearDim === "subcategory" ? "editorSubcategoryFilter" : clearDim === "procurementTarget" ? "editorProcurementTargetFilter" : "editorIndustryFilter";
      state[clearKey] = [];
      rerenderEditorSearchSectionBody();
      rerenderEditorTabArea();
      updateEditorFiltersActiveBadge();
    }
  });

  // Näyttää käsittelemättömät apiFetch()-virheet bannerina (esim. vain
  // luku -avaimen 403).
  window.addEventListener("unhandledrejection", function (e) {
    var msg = e.reason && e.reason.message;
    if (!msg) return;
    e.preventDefault();
    console.error("Käsittelemätön API-virhe:", e.reason);
    var banner = document.getElementById("banner");
    if (banner) banner.innerHTML = '<div class="banner">' + escapeHtml(msg) + "</div>";
  });

  // ---------- Käynnistys ----------
  render();
  initDb();
})();
</script>
</body>
</html>
